let pdfjsLib=null;
// every page of a PDF becomes one slide picture (done here in the browser, no internet needed)
async function pdfToSlides(pdf){
  if(!pdfjsLib){pdfjsLib=await import('/lib/pdf.min.mjs');pdfjsLib.GlobalWorkerOptions.workerSrc='/lib/pdf.worker.min.mjs'}
  const task=pdfjsLib.getDocument({url:'/media/'+pdf,standardFontDataUrl:'/lib/standard_fonts/'}),doc=await task.promise,slides=[];
  try{
    for(let i=1;i<=doc.numPages;i++){
      mmsg('Making slide '+i+' of '+doc.numPages+'…');
      const page=await doc.getPage(i),v1=page.getViewport({scale:1}),s=Math.min(3000/v1.width,1.5*Math.min(1920/v1.width,1080/v1.height));
      const vp=page.getViewport({scale:s}),cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvas:cv,canvasContext:ctx,viewport:vp}).promise;
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));
      slides.push({img:(await upload('/api/media/upload?ext=.jpg',blob)).file});page.cleanup();
    }
  }finally{try{task.destroy()}catch(e){}}
  if(!slides.length)throw new Error('This document has no pages.');
  return slides;
}
async function addDoc(inp){const f=inp.files[0];inp.value='';return addDocFile(f)}
async function addDocFile(f,opt){
  if(!f)return;
  const ext=extOf(f.name),name=f.name;
  try{
    let it;
    if(/^\.(pptx?|ppsx?|pptm)$/.test(ext)){
      const r=await upload('/api/media/ppt?ext='+encodeURIComponent(ext),f,p=>mmsg(p<1?'Sending the presentation… '+Math.round(p*100)+'%':'PowerPoint is turning the slides into pictures… this can take a minute.'));
      it={id:uid(),type:'slides',name,slides:r.files.map(img=>({img}))};
    }else{
      const pdf=ext==='.pdf'?(await upload('/api/media/upload?ext=.pdf',f,p=>mmsg('Adding the PDF… '+Math.round(p*100)+'%'))).file
        :(await upload('/api/media/office?ext='+encodeURIComponent(ext),f,p=>mmsg(p<1?'Sending the document… '+Math.round(p*100)+'%':'Microsoft Office is turning the document into pages… this can take a minute.'))).pdf;
      it={id:uid(),type:'slides',name,file:pdf,slides:await pdfToSlides(pdf)};
    }
    mmsg('');
    if(opt&&opt.into){saveMedia(S.media.map(x=>x.id===opt.into?{...x,slides:[...(x.slides||[]),...it.slides]}:x));renderMain();return}
    saveMedia([...(S.media||[]),it]);
    if(opt&&opt.noOpen)return it.id;
    openMedia(it.id);
  }catch(e){mmsg('');alert(e.message||'The document could not be added.')}
}

// sg.themes = { stanzaNumber: {k:'color'|'image'|'video', bg, file, fg, dim} } - saved with the song
function themeFor(sg,si){
  const t=sg&&sg.themes&&sg.themes[si];if(!t||!t.k)return null;
  if(t.k!=='color'&&S.media&&!S.media.some(m=>m.file===t.file))return null; // the picture / video was deleted from Media: use the normal background
  return{k:t.k,bg:t.bg||'#000000',file:t.file||'',fg:t.fg||'',dim:+t.dim||0};
}

  if(th.k!=='color'&&S.media&&!S.media.some(m=>m.file===th.file))return null;

}

  S.songs=S.songs.map(x=>{

  const txt={timer:'COUNTDOWN ON PROJECTOR',clock:'CLOCK ON PROJECTOR',yt:'VIDEO ON PROJECTOR',alert:'ALERT SHOWING'};
  for(const k in on){const e=document.getElementById('tag_'+k);if(!e)continue;const t=on[k]?txt[k]:(k==='timer'&&L.timer&&L.timer.running?'counting – hidden':'not on projector');if(e.textContent!==t){e.textContent=t;e.classList.toggle('live',on[k])}}
}
function setNameFx(){}
function timerStart(){
  const secs=Math.max(0,+tMin.value||0),msg=tMsg.value.trim(),T=(S.live||{}).timer||{};
  // a paused timer with the same minutes carries on; otherwise it starts again from the minutes typed
  const remain=!T.running&&T.secs===secs&&T.remain>0?T.remain:T.running&&T.secs===secs?T.end-now():secs*1000;
  setLive({...S.live,mode:'timer',timer:{secs,msg,running:true,end:now()+remain,remain:null},churchBlank:false});
}
function timerPause(){const T=(S.live||{}).timer;if(!T||!T.running)return;setLive({...S.live,timer:{...T,running:false,remain:Math.max(0,T.end-now())}})}
function timerReset(){const secs=Math.max(0,+tMin.value||0);setLive({...S.live,timer:{secs,msg:tMsg.value.trim(),running:false,remain:secs*1000}})}
function showClock(){setLive({...S.live,mode:'clock',churchBlank:false})}
function hideClock(){const L=S.live||{};setLive({...L,mode:L.mode==='clock'?'song':L.mode})}
function cornerClock(){}
function timerHide(){const L=S.live||{};if(L.mode==='timer')setLive({...L,mode:'song'})} // the countdown keeps running
function timerShow(){const L=S.live||{};if(!L.timer){alert('Press Start first.');return}setLive({...L,mode:'timer',churchBlank:false})}

const castable=link=>{const p=practiceSrc(link);return !!p&&(p.kind==='video'||['YouTube','Vimeo','Facebook','Google Drive'].includes(p.name))};
function projYT(link,title){
  const p=practiceSrc(link);
  if(!p||!castable(link)){alert('This link cannot be shown on the projector. Video links from YouTube, Vimeo, Facebook, Google Drive or a video file (.mp4) can. Music links (Spotify, MP3…) play on this computer only.');return}
  closePractice();
  const yt=p.name==='YouTube',L=S.live||{},src=yt?p.src+'&controls=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1':p.src;
  setLive(coverVideo(L,{...L,mode:'yt',churchBlank:false,churchHide:false,yt:{src,raw:!yt,title:title||'',k:Date.now(),n:0,cmd:'',playing:true}},true));
}
function projYTSong(id,k){const sg=S.songs.find(x=>x.id===id),l=sg?songLinks(sg)[k||0]:null;if(l)projYT(l.u,sg.title)}
function pracToProj(){if(prac)projYTSong(prac.id,prac.k||0)}

async function ytPasteBox(){
  try{const t=(await navigator.clipboard.readText()).trim();const m=t.match(/https?:\/\/[^\s<>"']+/i);ytUrl.value=m?m[0]:t}
  catch(e){ytUrl.focus();alert('This browser does not allow the button to read the clipboard. Tap in the box and paste with Ctrl+V (on a phone, press and hold, then Paste).')}
}

function ytStop(){const L=S.live||{};if(L.mode==='yt')setLive({...L,mode:'song',yt:null})}

function alPrev(save){
  const t=document.getElementById('aText'),b=document.getElementById('aBg'),f=document.getElementById('aFg'),p=document.getElementById('alPrev');if(!p||!b||!f)return;
  p.style.background=b.value;p.style.color=f.value;p.textContent=(t&&t.value.trim())||'Alert preview';
  if(save){try{localStorage.setItem('alCol',JSON.stringify({bg:b.value,fg:f.value}))}catch(e){}}
  document.querySelectorAll('.alsw').forEach((e,i)=>e.classList.toggle('sel',AL_PRE[i][1]===b.value.toLowerCase()&&AL_PRE[i][2]===f.value.toLowerCase()));
}
function alPick(i){const b=document.getElementById('aBg'),f=document.getElementById('aFg');if(!b||!f)return;b.value=AL_PRE[i][1];f.value=AL_PRE[i][2];alPrev(true)}
function sendAlert(){
  const text=aText.value.replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).join('\n');if(!text){alert('Type the alert first.');return}
  const d=+aDur.value,bg=aBg.value||'#c0392b',fg=aFg.value||'#ffffff';
  try{localStorage.setItem('alCol',JSON.stringify({bg,fg}))}catch(e){}
  setLive({...S.live,alert:{text,until:d?now()+d*1000:0,stream:aStream.checked,id:Date.now(),bg,fg}});
}
function clearAlert(){setLive({...S.live,alert:null})}
const alertOn=A=>!!(A&&A.text&&(!A.until||A.until>now()));
function liveDesc(L,cs){
  const M=L.media||{};
  if(L.mode==='media')return M.type==='video'?'Video: '+esc(M.name)+(M.play?' (playing)':' (paused)'):M.type==='slides'?'Slides: '+esc(M.name)+' – '+(M.slide+1)+' of '+M.count:'Picture: '+esc(M.name);
  if(L.mode==='timer')return 'Countdown <span id="stTimer">'+fmtTime(timerLeft(L.timer))+'</span>'+((L.timer||{}).running?'':' (paused)')+' <button style="padding:2px 8px" onclick="timerHide()">Hide</button>';
  if(L.mode==='clock')return 'Clock (the time) <button style="padding:2px 8px" onclick="hideClock()">Hide</button>';
  if(L.mode==='yt')return '📺 '+(L.yt&&L.yt.raw?'Video':'YouTube video')+(L.yt&&L.yt.title?': '+esc(L.yt.title):'')+(L.yt&&L.yt.raw?' ':' <button style="padding:2px 8px" onclick="ytCmd(\'pause\')">⏸</button><button style="padding:2px 8px" onclick="ytCmd(\'play\')">▶</button>')+'<button style="padding:2px 8px" onclick="ytStop()">⏹ Stop</button>';
  return cs;
}

function mediaLayer(){let ml=document.getElementById('ml');if(!ml){ml=document.createElement('div');ml.id='ml';ml.innerHTML='<img id="mli" alt=""><video id="mlv" playsinline></video>';document.body.appendChild(ml)}return ml}
// a YouTube video shown full screen on the projector (the church sings along). Play / pause / stop come from the control page.
function showYtLayer(Y){
  let el=document.getElementById('ytl');
  if(!Y){if(el&&el.style.display!=='none'){el.style.display='none';const f=el.querySelector('iframe');if(f)f.remove()}return} // removing the frame stops the sound
  if(!el){el=document.createElement('div');el.id='ytl';document.body.appendChild(el)}
  if(PREVIEW){ // the small preview on the laptop never plays the video (only the real projector does), so there is just one sound
    const f0=el.querySelector('iframe');if(f0)f0.remove();
    el.style.display='flex';el.style.cssText+=';align-items:center;justify-content:center;color:#fff;font:600 14px Arial,sans-serif';el.textContent='📺 '+(Y.title||'YouTube video')+' – playing on the projector';return;
  }
  let f=el.querySelector('iframe');
  if(!f||f.dataset.k!==String(Y.k)){
    if(f)f.remove();
    f=document.createElement('iframe');f.dataset.k=String(Y.k);f.dataset.n=String(Y.n||0);
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.setAttribute('allowfullscreen','');f.referrerPolicy='strict-origin-when-cross-origin';
    f.src=Y.raw?Y.src:Y.src+'&origin='+encodeURIComponent(location.origin);el.appendChild(f);
  }
  el.style.display='block';
  if(f.dataset.n!==String(Y.n||0)){
    f.dataset.n=String(Y.n||0);
    if(Y.cmd)try{f.contentWindow.postMessage(JSON.stringify({event:'command',func:Y.cmd==='pause'?'pauseVideo':'playVideo',args:[]}),'*')}catch(e){}
  }
}
function showMediaLayer(M){
  const ml=mediaLayer(),img=document.getElementById('mli'),v=document.getElementById('mlv');
  if(!M){ml.style.display='none';if(!v.paused)v.pause();return}
  ml.style.display='flex';ml.dataset.fit=M.fit||'fit';
  if(M.type==='video'){
    img.style.display='none';v.style.display='block';const src='/media/'+M.file;
    if(v.dataset.src!==src){v.dataset.src=src;v.src=src}
    syncVideo(v,M,PREVIEW||!!M.muted);
  }else{
    v.style.display='none';if(!v.paused)v.pause();img.style.display='block';
    const src='/media/'+(M.type==='slides'?(M.s||{}).img:M.file);if(img.getAttribute('src')!==src)img.setAttribute('src',src);
  }
}
// wallpaper video movement: normal, slower, or a still picture; optionally softened (blurred)
function calmVideo(v,c){
  const sp=c.wpSpeed===undefined?1:+c.wpSpeed,soft=+c.wpSoft||0;
  v.style.filter=soft?'blur('+soft+'px)':'';v.style.transform=soft?'scale(1.04)':'';
  if(sp>0){v.defaultPlaybackRate=sp;v.playbackRate=sp;if(v.paused)v.play().catch(()=>{});return}
  if(!v.paused)v.pause();
  if(v.readyState<2)v.addEventListener('loadeddata',()=>{if(!v.currentTime)v.currentTime=0.1},{once:true});
}

function sealSvg(nm,id){
  id=id||'sealP';
  const R=76,cx=100,cy=100,rad=d=>d*Math.PI/180,pt=(deg,r)=>[cx+r*Math.sin(rad(deg)),cy-r*Math.cos(rad(deg))].map(v=>v.toFixed(2)).join(',');
  // angles are clock angles (0 = 12 o'clock, clockwise). 8 o'clock = 240 deg, 4 o'clock = 120 deg (going over the top)
  const A0=240,SPAN=240,txt=String(nm||'').toUpperCase().trim();
  const arcLen=R*rad(SPAN-8);
  const fs=Math.max(9,Math.min(20,arcLen/Math.max(txt.length,1)/0.8)); // long names get slightly smaller letters so they always fit the arc
  const startA=A0+4, endA=A0+SPAN-4;
  const path='M'+pt(startA%360,R)+' A'+R+','+R+' 0 1,1 '+pt(endA%360,R);
  // stars along the bottom (from 4 o'clock round to 8 o'clock), 5 of them
  let stars='';const N=5,S0=130,S1=230;
  for(let i=0;i<N;i++){
    const ang=S0+(S1-S0)*i/(N-1),mid=Math.abs(i-(N-1)/2)<.1,rs=mid?8:6,ri=rs*.4,c=pt(ang,R-3).split(',').map(Number);
    let d='';for(let j=0;j<10;j++){const r=j%2?ri:rs,t=rad(j*36);d+=(j?'L':'M')+(c[0]+r*Math.sin(t)).toFixed(2)+','+(c[1]-r*Math.cos(t)).toFixed(2)}
    stars+='<path d="'+d+'Z"/>';
  }
  const m=id+"m",ch=100,cw=ch*0.6; // the crucifix fills the middle so Christ can be seen // crucifix picture is 179 x 300
  return '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor">'+
    '<defs><path id="'+id+'" d="'+path+'"/><mask id="'+m+'" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><image href="'+CRUC_IMG+'" x="'+(cx-cw/2).toFixed(2)+'" y="'+(cy-ch/2).toFixed(2)+'" width="'+cw.toFixed(2)+'" height="'+ch+'"/></mask></defs>'+
    '<circle cx="100" cy="100" r="96" stroke-width="3.5"/><circle cx="100" cy="100" r="90.5" stroke-width="1"/>'+
    '<circle cx="100" cy="100" r="64" stroke-width="1.6"/>'+
    '<text fill="currentColor" stroke="none" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="'+fs.toFixed(1)+'" dominant-baseline="middle"><textPath href="#'+id+'" textLength="'+arcLen.toFixed(1)+'" lengthAdjust="spacing">'+esc(txt)+'</textPath></text>'+
    '<g fill="currentColor" stroke="none">'+stars+'</g>'+
    '<rect x="0" y="0" width="200" height="200" fill="currentColor" stroke="none" mask="url(#'+m+')"/>'+
    '</svg>';
}

function renderLower3(){
  const L=S.live||{};let el=document.getElementById('l3');
  const on=V==='stream'&&L.mode==='timer'&&L.timer&&!L.streamBlank&&!licStopped(S.lic);
  if(!on){if(el)el.style.display='none';return}
  if(!el){el=document.createElement('div');el.id='l3';el.innerHTML='<span class="l3m"></span><b class="l3n"></b><i>sec</i>';document.body.appendChild(el)}
  const ms=timerLeft(L.timer),m=(L.timer.msg||''),mm=el.querySelector('.l3m'),n=el.querySelector('.l3n'),tx=fmtTime(ms);
  if(mm.textContent!==m)mm.textContent=m;mm.style.display=m?'':'none';
  if(n.textContent!==tx)n.textContent=tx;n.classList.toggle('done',ms<=0);el.style.display='flex';
}
function renderAlert(){
  const A=(S.live||{}).alert;let el=document.getElementById('al');
  const on=alertOn(A)&&(V==='church'||A.stream);
  if(!on){if(el)el.style.display='none';return}
  if(!el){el=document.createElement('div');el.id='al';document.body.appendChild(el)}
  const sig=[A.id,A.bg||'',A.fg||'',A.text].join('|');
  if(el.dataset.id!==sig){
    el.dataset.id=sig;
    el.style.background=A.bg||'#c0392b';el.style.color=A.fg||'#ffffff';
    const lines=String(A.text).replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);
    el.innerHTML=lines.map(x=>'<div>'+esc(x)+'</div>').join('');
    el.style.display='flex';
    // more lines = a little smaller letters, so the bar never takes more than about half of the screen
    let fs=lines.length>=5?3:lines.length===4?3.3:lines.length===3?3.7:lines.length===2?4:4.4;
    el.style.fontSize=fs+'vh';
    for(let k=0;k<30&&el.scrollHeight>el.clientHeight+1&&fs>1.8;k++){fs-=.2;el.style.fontSize=fs+'vh'}
  }
  el.style.display='flex';
}
function tickClock(force){

}

/* ---- DUPLICATE SONGS: songs with SIMILAR words (not only identical stanzas) are grouped. In each group the LONGEST song is kept
   and every shorter song whose words are mostly found in it is suggested for removal (ticked). Untick any you want to keep. ---- */
let dupGroups=[],dupTick=new Set(),dupSug=new Set();
const dupWords=t=>String(t||'').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(Boolean);
function dupFind(mode){
  const t={most:.85,half:.6,any:.4}[mode]||.6; // how much of the shorter song must be found in the other
  const info=S.songs.filter(x=>!x.bible).map(x=>{const w=dupWords(x.text),sh=new Set();for(let i=0;i+2<w.length;i++)sh.add(w[i]+' '+w[i+1]+' '+w[i+2]);
    return {x,w:w.length,sh,n:stanzas(x.text).length}}).filter(o=>o.sh.size>=6); // groups of 3 words; very short songs are left out
  const N=info.length,idx=new Map();
  info.forEach((o,i)=>o.sh.forEach(k=>{let a=idx.get(k);if(!a){a=[];idx.set(k,a)}a.push(i)}));
  const cap=Math.max(25,Math.round(N*.02)),pair=new Map(); // phrases found in very many songs ("praise the lord") say nothing
  idx.forEach(a=>{if(a.length<2||a.length>cap)return;for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const k=a[i]*N+a[j];pair.set(k,(pair.get(k)||0)+1)}});
  const shared=(a,b)=>pair.get(Math.min(a,b)*N+Math.max(a,b))||0;
  const par=info.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
  pair.forEach((c,k)=>{const a=Math.floor(k/N),b=k%N;if(c/Math.min(info[a].sh.size,info[b].sh.size)>=t)par[f(a)]=f(b)});
  const g=new Map();info.forEach((o,i)=>{const r=f(i);if(!g.has(r))g.set(r,[]);g.get(r).push(i)});
  const out=[];dupSug=new Set();
  const cont=(a,b)=>shared(a,b)/info[a].sh.size; // how much of song a is found in song b
  const noOf=i=>+info[i].x.no||1e9;
  g.forEach(ix=>{if(ix.length<2)return;
    // Keep the MOST COMPLETE song: the one that contains the most of what the others have (then the longest, then the lower number).
    // Every song mostly found in it is ticked. Songs that are not are split into their own group, with their own most complete song.
    let rest=ix.slice();
    while(rest.length>1){
      const cover=k=>rest.reduce((s,m)=>m===k?s:s+cont(m,k),0);
      const kp=rest.slice().sort((a,b)=>cover(b)-cover(a)||info[b].w-info[a].w||info[b].n-info[a].n||noOf(a)-noOf(b)||byTitle(info[a].x,info[b].x))[0];
      const mem=rest.filter(m=>m===kp||cont(m,kp)>=t);
      rest=rest.filter(m=>!mem.includes(m));
      if(mem.length<2)continue;
      const K=info[kp];
      const rows=mem.map(i=>{const o=info[i];
        if(i===kp)return {x:o.x,n:o.n,w:o.w,keep:true,sim:1,best:1,share:'—',ex:(stanzas(o.x.text)[0]||[]).join('\n')};
        const sim=cont(i,kp),sug=sim>=Math.max(t,.6); // ticked only when at least 60% of its words are in the kept song: a different song sharing a stanza is not lost
        if(sug)dupSug.add(o.x.id);
        return {x:o.x,n:o.n,w:o.w,keep:false,sug,sim,best:sim,to:K.x,share:Math.round(sim*100)+'% in the kept song',ex:(stanzas(o.x.text)[0]||[]).join('\n')}});
      rows.sort((a,b)=>(b.keep-a.keep)||(b.sim-a.sim));
      out.push(rows);
    }
  });
  out.sort((a,b)=>String(a[0].x.title).localeCompare(String(b[0].x.title)));
  return out;
}
// how long each song of a group is: the bar is the number of words, so the longer (fuller) song is easy to see
function dupCount(g,r){
  const mx=Math.max(...g.map(q=>q.w));
  return '<span class="dcnt'+(r.keep?' mx':r.sug?' mn':'')+'">'+r.n+' stanza'+(r.n===1?'':'s')+' · '+r.w+' words</span>'+
    (r.keep?' <span class="dtag">✔ KEEP – the most complete</span>':r.sug?' <span class="dtag lo">✖ SUGGESTED TO REMOVE – '+(r.sim>=.98&&r.w===(g.find(q=>q.keep)||{}).w?'an exact copy of the kept song':Math.round(r.sim*100)+'% of its words are in the kept song'+(r.w<(g.find(q=>q.keep)||{}).w?' (shorter)':''))+'</span>':' <span class="dtag eq">'+Math.round(r.best*100)+'% alike – look at it yourself</span>')+
    '<div class="dbar"><i style="width:'+Math.round(100*r.w/(mx||1))+'%"></i></div>';
}
function openDups(){dupDlg.showModal();dupRun(true)}
function dupRun(auto){
  dupGroups=dupFind(dupMode.value);
  if(auto===true)dupTick=new Set(dupSug); // the suggestions start ticked
  const keep=new Set(S.songs.map(x=>x.id));[...dupTick].forEach(i=>{if(!keep.has(i))dupTick.delete(i)});
  dupInfo.innerHTML=dupGroups.length?'<b style="color:#e0b24a">'+dupGroups.length+' group'+(dupGroups.length>1?'s':'')+'</b> of songs with similar words ('+dupGroups.reduce((a,g)=>a+g.length,0)+' songs). <b style="color:#ff9a8a">'+dupSug.size+' song'+(dupSug.size===1?' is':'s are')+' suggested for removal</b> (the most complete song of each group is kept) and already ticked – untick any you want to keep. <button style="font-size:12px;padding:2px 8px" onclick="dupTick=new Set(dupSug);dupRun()">Tick all suggestions</button> <button style="font-size:12px;padding:2px 8px" onclick="dupTick.clear();dupRun()">Untick all</button>':'<b style="color:#2e9d6b">No similar songs found.</b>';
  dupRes.innerHTML=dupGroups.map((g,gi)=>'<div class="dgrp"><h4>Group '+(gi+1)+' · '+g.length+' songs · keep 1, remove '+g.filter(r=>r.sug).length+' <button style="font-size:12px;padding:2px 8px" onclick="dupKeepMenu('+gi+')">Choose the one to keep…</button></h4>'+
    g.map((r,ri)=>'<div class="dsong'+(dupTick.has(r.x.id)?' del':'')+(r.keep?' most':'')+'"><input type="checkbox" '+(dupTick.has(r.x.id)?'checked':'')+' onchange="dupToggle(\''+r.x.id+'\',this.checked)" title="Delete this song">'+
      '<div class="dm"><b>'+(r.x.no?r.x.no+'. ':'')+esc(String(r.x.title).replace(/\*/g,''))+'</b> <small>'+(r.x.folder?esc(r.x.folder):'')+'</small> '+dupCount(g,r)+
      (r.ex?'<div class="shr">'+esc(r.ex)+'</div>':'')+'<button style="font-size:12px;padding:2px 8px;margin-top:4px" onclick="dupKeep('+gi+','+ri+')">✔ Keep this one, tick the others</button></div></div>').join('')+'</div>').join('');
  const n=dupTick.size;dupDel.textContent='Delete ticked'+(n?' ('+n+')':'');dupDel.disabled=!n;
}
function dupToggle(id,on){on?dupTick.add(id):dupTick.delete(id);dupRun()}
function dupKeepOne(gi,ri){dupGroups[gi].forEach((r,k)=>{if(k===ri)dupTick.delete(r.x.id);else dupTick.add(r.x.id)});dupRun()}
const dupKeep=dupKeepOne;
function dupKeepMenu(gi){const g=dupGroups[gi],t=prompt('Which song do you want to KEEP?\n\n'+g.map((r,i)=>(i+1)+'. '+(r.x.no?'['+r.x.no+'] ':'')+r.x.title).join('\n')+'\n\nType its number (1–'+g.length+'). The others get ticked.');const k=parseInt(t,10);if(k>=1&&k<=g.length)dupKeepOne(gi,k-1)}
function dupDelete(){
  const ids=[...dupTick],list=S.songs.filter(x=>dupTick.has(x.id));if(!list.length)return;
  if(!confirm('Delete '+list.length+' song(s)?\n\n'+list.slice(0,12).map(x=>'• '+x.title).join('\n')+(list.length>12?'\n…and '+(list.length-12)+' more':'')+'\n\nThey are also taken out of every playlist. A copy stays in “Deleted songs”.'))return;
  if(dupTick.has(curSong))curSong=null;
  post({songs:S.songs.filter(x=>!dupTick.has(x.id)),playlists:S.playlists.map(p=>({...p,songIds:p.songIds.filter(i=>!dupTick.has(i))}))});
  S.songs=S.songs.filter(x=>!dupTick.has(x.id));dupTick.clear();dupRun();renderSide();
}
function dupPdf(){
  if(!dupGroups.length){alert('No duplicates to print.');return}
  const h='<!doctype html><meta charset="utf-8"><title>Duplicate songs</title><style>body{font:13px Arial,sans-serif;color:#000;margin:18px}h1{font-size:20px}h2{font-size:15px;margin:16px 0 4px;border-bottom:2px solid #444}.s{margin:6px 0;padding:6px;border:1px solid #999;page-break-inside:avoid}.s b{font-size:14px}.x{white-space:pre-wrap;margin:4px 0 0;padding:4px 8px;border-left:3px solid #c99a35;background:#f4f1e8}.k{display:inline-block;width:14px;height:14px;border:2px solid #000;vertical-align:middle;margin-right:6px}</style><h1>Duplicate songs – '+new Date().toLocaleDateString('en-GB')+'</h1><p>'+dupGroups.length+' groups. Tick the box beside the songs to delete; keep one in each group.</p>'+
    dupGroups.map((g,gi)=>'<h2>Group '+(gi+1)+'</h2>'+g.map(r=>'<div class="s"><span class="k"></span><b>'+(r.x.no?r.x.no+'. ':'')+esc(String(r.x.title).replace(/\*/g,''))+'</b> '+(r.x.folder?'('+esc(r.x.folder)+') ':'')+'– <b style="font-size:15px;'+(r.n===Math.max(...g.map(q=>q.n))&&g.some(q=>q.n!==r.n)?'background:#cfeedd;padding:1px 6px;border:2px solid #1d7a4d':'')+'">'+r.n+' stanzas'+(r.n===Math.max(...g.map(q=>q.n))&&g.some(q=>q.n!==r.n)?' ★ MOST':'')+'</b>, '+r.w+' words – '+(r.keep?'KEEP (most complete)':r.sug?'SUGGESTED TO REMOVE ('+Math.round(r.sim*100)+'% in the kept song)':Math.round(r.best*100)+'% alike – check')+(r.ex?'<div class="x">'+esc(r.ex)+'</div>':'')+'</div>').join('')).join('');
  const w=window.open('','_blank');if(!w){alert('Allow pop-ups, then press PDF / Print again.');return}
  w.document.write(h);w.document.close();w.focus();setTimeout(()=>w.print(),400);
}

/* ---- search box: ↓ / ↑ move through the found songs (first press = 1st choice), Enter opens the highlighted one (or the first) and leaves the box, so the number keys show its lines ---- */
let srchIdx=-1;
function qKey(e){
  const items=[...document.querySelectorAll('#list .song')].filter(x=>x.querySelector('span[onclick]'));
  const mark=()=>{items.forEach((x,i)=>x.classList.toggle('kb',i===srchIdx));const it=items[srchIdx];if(it)it.scrollIntoView({block:'nearest'})};
  if(e.key==='ArrowDown'){e.preventDefault();if(!items.length)return;srchIdx=Math.min(srchIdx+1,items.length-1);mark()}
  else if(e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;srchIdx=Math.max(srchIdx-1,0);mark()}
  else if(e.key==='Enter'){
    e.preventDefault();
    const it=items[srchIdx>=0?srchIdx:0],f=it&&it.querySelector('span[onclick]');if(!f)return;
    srchIdx=-1;f.click();
    setTimeout(()=>{const i=document.getElementById('q');if(i)i.blur();if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur()},0);
  }
}
</script>
