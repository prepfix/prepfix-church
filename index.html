<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prepfix Church Media Toolkit</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#16181d"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Church Media">
<style>
*{box-sizing:border-box}
html,body{margin:0}html{height:100%}body.church,body.stream{min-height:100%} /* the projector wallpaper covers the whole screen */
body{font-family:Verdana,system-ui,sans-serif;background:#16181d;color:#ece8e1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:#2a2f38;border:0;border-radius:6px;padding:9px 13px;cursor:pointer}
button:hover{background:#38404d}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #e0b24a}
.pri{background:#e0b24a;color:#1a1405;font-weight:700}.pri:hover{background:#ebc467}
.dng{background:#7a2b2b}.dng:hover{background:#933535}.on{background:#2e7d5b!important}
input,textarea,select{background:#0f1115;border:1px solid #333a45;border-radius:6px;padding:8px;width:100%}
textarea{min-height:50vh;resize:vertical;line-height:1.5}
a{color:inherit}
/* output screens */
.out{position:fixed;inset:0;display:flex;padding:4vh 5vw;overflow:hidden}
.out .t{width:100%;max-height:100%;overflow:hidden;text-align:center;overflow-wrap:anywhere;line-height:1.3}
.out .t div{margin:.16em 0}
body.church{background:#000;cursor:none}.church .out{align-items:center;z-index:2;padding:5vh 5vw 10vh} /* the round church seal is removed, so lyrics may use the top of the screen; the bottom 10vh still belongs to the clock and church name */
#bgv,#dim{position:fixed;inset:0;width:100%;height:100%;display:none}
#bgv{object-fit:cover;z-index:0;background:#000}#dim{background:#000;opacity:.4;z-index:1}
html:has(body.stream),body.stream{background:transparent}.stream .out{align-items:flex-end;padding-bottom:6vh;gap:2.5vw}
.stream .t{font-weight:700;width:auto;flex:1;min-width:0}
#sseal{flex:0 0 auto;width:16vh;height:16vh;color:#fff;filter:drop-shadow(0 0 3px #000) drop-shadow(0 1px 5px rgba(0,0,0,.9));display:none}#sseal svg{width:100%;height:100%;display:block}
/* control */
#app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
aside{background:#1d2026;padding:12px;border-right:1px solid #2c313a;overflow:auto;max-height:calc(100vh - var(--bh,0px));position:sticky;top:var(--bh,0px)}
main{padding:14px;max-width:920px;width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.multibar{padding:8px 10px;margin:4px 0 6px;background:#232a36;border-left:3px solid #e0b24a;border-radius:6px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.multibar button{padding:6px 10px}
.tabs button{flex:1}.tabs button.sel{background:#e0b24a;color:#1a1405}
.song{display:flex;gap:6px;align-items:center;padding:10px 4px;border-bottom:1px solid #2a2f38;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.song span{flex:1;cursor:pointer}.song.cur{background:#243553;border-radius:6px}.song.cur>span:first-child{color:#fff;font-weight:700}.song.cur .sno{color:#ffd86b;font-weight:800}
.song button{padding:4px 9px}
.mrow{cursor:grab}.song.dov,.secrow.dov,.fold.dov{box-shadow:inset 0 3px 0 #e0b24a}.song[draggable=true],.secrow[draggable=true],.fold[draggable=true]{cursor:grab}
.mrow.dov{box-shadow:inset 0 3px 0 #e0b24a}.grip{font-style:normal;color:#8a90a0;cursor:grab;padding:0 2px}
.tmv{position:absolute;right:4px;bottom:4px;display:flex;gap:4px;z-index:2}.tmv button{padding:2px 8px;font-size:12px}
.fold{display:flex;gap:8px;align-items:center;margin:6px 0 2px;padding:10px 10px;background:#232832;border:1px solid #2f3641;border-radius:8px;cursor:pointer;font-weight:700;-webkit-user-select:none;user-select:none}.fold.open{background:#2d3441;border-color:#e0b24a}.fold .fn{flex:1}.fold small{opacity:.75;font-weight:400}
.secrow{display:flex;gap:6px;align-items:center;margin:12px 0 2px;padding:6px 8px;background:#2a2410;border-left:4px solid #e0b24a;border-radius:6px}.secrow>span{flex:1;font-weight:700;color:#f0c75e;cursor:pointer;text-transform:uppercase;letter-spacing:.03em;font-size:14px}.secrow button{padding:3px 8px}.secrow .slead,.slead{text-transform:none;color:#ddd;font-weight:600;letter-spacing:0;flex:none}
.selr{cursor:pointer}.selr span{color:#e8eaf0;font-size:15px}.selr input{width:20px;height:20px;flex:0 0 auto;margin:0 4px;accent-color:#e0b24a}.selr.on{background:#2a3550!important;color:#fff!important}.selr.on span{color:#fff;font-weight:600}.selbar{position:sticky;top:0;z-index:5;background:#161a21;border:1px solid #e0b24a;border-radius:8px;padding:8px;margin-bottom:8px}
.status{background:#0f1115;border:1px solid #333a45;border-radius:8px;padding:10px;margin-bottom:14px;font-size:14px;position:sticky;top:var(--bh,0px);z-index:5}
.status b{color:#e0b24a}
.srow{display:flex;align-items:center;gap:8px;padding:3px 0}.srow+.srow{border-top:1px solid #262b34;margin-top:3px;padding-top:6px}
.srow .dot{flex:0 0 auto;margin:0}.slab{flex:0 0 58px;font-weight:700;color:#ece8e1}
#credit{position:fixed;left:0;right:0;bottom:0;z-index:60;height:24px;line-height:24px;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#e0b24a;background:#101318;border-top:1px solid #2c313a;pointer-events:none;user-select:none}
body:has(#credit){padding-bottom:24px}body:has(#credit) aside{max-height:calc(100vh - 24px - var(--bh,0px))}
.teamToast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;background:#1f6f4a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px #0009;max-width:92vw}.teamToast button{margin-left:8px;padding:3px 10px}
#prac{position:fixed;right:12px;bottom:36px;z-index:50;background:#12151b;border:1px solid #3a4150;border-radius:12px;box-shadow:0 10px 30px #000a;display:flex;flex-direction:column;overflow:hidden}
#prac .phd{display:flex;align-items:center;gap:4px;padding:5px 6px 5px 10px;background:#1c2028}
#prac .pt{flex:1;min-width:0;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prac .phd button{padding:4px 9px;font-size:13px}
#prac .pbody{background:#000}#prac iframe,#prac video{display:block;width:100%;height:100%;border:0}
#prac audio{display:block;width:100%}#prac.aud .pbody{background:none;padding:6px;height:auto!important}
#prac.sz-small{width:300px}#prac.sz-small .pbody{height:169px}
#prac.sz-mid{width:420px}#prac.sz-mid .pbody{height:236px}
#prac.sz-big{width:min(720px,60vw)}#prac.sz-big .pbody{height:min(405px,34vw)}
#prac.tall.sz-small .pbody,#prac.tall.sz-mid .pbody{height:232px}
body.pracOn main{padding-bottom:350px}
@media(max-width:700px){
#prac{left:0;right:0;bottom:24px;width:auto!important;border-radius:12px 12px 0 0}
#prac.sz-small .pbody{height:120px}#prac.sz-mid .pbody{height:56vw;max-height:260px}#prac.sz-big .pbody{height:56vw;max-height:none}
body.pracOn main{padding-bottom:62vw}}
.sval{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.stog{flex:0 0 auto;min-width:128px;padding:8px 10px;font-weight:700}.stog.off{background:#b8392f!important;color:#fff!important;border-color:#b8392f}
@media(max-width:700px){.slab{flex-basis:48px}.stog{min-width:96px;padding:8px 6px;font-size:13px}.sval .hint{display:none}}
.plstrip{margin-top:8px;border-top:1px solid #333a45;padding-top:6px}.plh{display:flex;align-items:center;gap:8px;font-size:12px;color:#aab}.plh b{color:#e0b24a}.plh .sp{flex:1}.plh button{padding:1px 9px;font-size:12px;min-width:0}
.plrow{position:relative;display:flex;gap:6px;overflow-x:auto;padding:5px 0 3px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.plchip{flex:0 0 auto;max-width:210px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 12px;font-size:13px;border-radius:999px;border:2px solid #3a4150;background:#1b1f26;color:#dfe3ea;cursor:pointer}.plchip:hover{border-color:#6b7688}
.plchip.cur{border-color:#e0b24a;background:#3a2f12;color:#fff;font-weight:700}.plchip.onscr::before{content:"● ";color:#2e9d6b}
.plsec{flex:0 0 auto;align-self:center;font-size:11px;font-weight:700;color:#e0b24a;padding:0 4px;text-transform:uppercase;letter-spacing:.04em}
.navb{display:flex;gap:8px;margin-top:8px}.navb button{flex:1;padding:11px;font-weight:700}
.hid{background:#b8392f!important;color:#fff}
.mprev.audio{flex-direction:column;gap:6px;cursor:default;background:linear-gradient(135deg,#1d2a44,#0f1115)}.aicon{font-size:64px}.aname{font-size:20px;font-weight:700}
.star.on{background:none!important}.star:hover{background:#2a2f38!important}.song .star{background:none;padding:2px 6px;font-size:18px;color:#8a90a0;line-height:1}.song .star.on{color:#f5c518}
.star.big{font-size:22px;padding:4px 10px;color:#8a90a0;background:none}.star.big.on{color:#f5c518}.fstar{color:#f5c518}
.favpl{margin:0 0 8px;color:#f5c518}
.favf{flex:0 0 auto;padding:8px 10px;color:#f5c518}.favf.on{background:#5a4a12!important;color:#ffd84a}
#bm{position:fixed;right:1.6vw;bottom:1.3vh;z-index:4;display:none;align-items:center;gap:.9vw;opacity:1;pointer-events:none;font:700 2.5vh 'Segoe UI',Arial,sans-serif;color:#fff;letter-spacing:.05em;padding:.6vh 1.2vw;background:rgba(0,0,0,.5);border-radius:1vh;text-shadow:0 1px 3px #000}
#bm img{height:3.4vh;width:auto}
#bm[class*=fx-]:not(.fx-none){opacity:1;font-size:2.5vh}#bm[class*=fx-]:not(.fx-none) img{height:3.4vh}
@keyframes bmGlow{0%,100%{text-shadow:0 0 .15em rgba(255,215,106,.35),0 1px 3px #000}50%{text-shadow:0 0 .3em rgba(255,215,106,.6),0 1px 3px #000}}
@keyframes bmShim{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes bmNeon{0%,100%{color:#fff;text-shadow:0 0 .3em #ff2d95,0 0 .9em #ff2d95}33%{color:#fff;text-shadow:0 0 .3em #2dd4ff,0 0 .9em #2dd4ff}66%{color:#fff;text-shadow:0 0 .3em #7dff6b,0 0 .9em #7dff6b}}
@keyframes bmPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
@keyframes bmWave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-.4em)}}
@keyframes bmType{0%{max-width:0}50%,88%{max-width:60em}100%{max-width:0}}
.fx-glow span{animation:bmGlow 4s ease-in-out infinite}
.fx-shimmer span{background:linear-gradient(100deg,#b8860b 20%,#fff6c0 45%,#ffd700 50%,#fff6c0 55%,#b8860b 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:bmShim 3s linear infinite}
.fx-neon span{animation:bmNeon 6s linear infinite}
.fx-pulse span{display:inline-block;animation:bmPulse 2.2s ease-in-out infinite}
.fx-wave span i{display:inline-block;font-style:normal;animation:bmWave 1.8s ease-in-out infinite}
.fx-type span{display:inline-block;overflow:hidden;white-space:nowrap;border-right:.1em solid #fff;animation:bmType 7s steps(34,end) infinite}
#ytl{position:fixed;inset:0;z-index:5;background:#000;display:none}#ytl iframe{width:100%;height:100%;border:0;display:block}
#ck{position:fixed;left:1.6vw;bottom:1.3vh;z-index:4;display:none;opacity:.55;pointer-events:none;font:600 2.3vh 'Segoe UI',Arial,sans-serif;color:#fff;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #000,0 0 2px #000}
#dropz{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(15,17,21,.9);border:5px dashed #e0b24a;color:#ffd86b;font:700 clamp(18px,3vw,30px) Verdana,sans-serif;text-align:center;padding:24px;pointer-events:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;display:none;background:#1d2a44;color:#fff;border:1px solid #e0b24a;border-radius:8px;padding:10px 16px;font-size:15px;box-shadow:0 6px 20px #000a;max-width:90vw}
.libr{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2c313a}.libr .hint{overflow-wrap:anywhere}
.pvw{position:fixed;right:14px;bottom:14px;z-index:30;width:260px;height:146px;border:2px solid #e0b24a;border-radius:8px;overflow:hidden;background:#000;box-shadow:0 6px 20px #000a;display:none}
.pvw iframe{width:1280px;height:720px;border:0;transform:scale(.2031);transform-origin:0 0;pointer-events:none}
.pvw span{position:absolute;left:5px;top:3px;z-index:2;font-size:10px;color:#ddd;background:#000b;padding:1px 5px;border-radius:3px}
.pvw{cursor:pointer}.pvw.min{height:24px!important;width:130px!important}.pvw.min iframe{visibility:hidden}
@media(max-width:760px){.pvw{width:176px;height:99px;right:8px;bottom:8px}.pvw iframe{transform:scale(.1375)}}
body.preview{cursor:default}
.more{display:contents}
.navb button small{display:block;font-size:11px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb .hb{flex:0 0 auto;min-width:110px}.navb button:disabled{opacity:.35}
.sm{width:52px!important;flex:0 0 52px;padding:4px 6px;font-size:20px;text-align:center}.sh{flex-wrap:nowrap}.sh h2{overflow-wrap:anywhere}
/* media + tools */
#ml{position:fixed;inset:0;z-index:3;background:#000;display:none;align-items:center;justify-content:center}
#ml img,#ml video{width:100%;height:100%;object-fit:contain}
#ml[data-fit=crop] img,#ml[data-fit=crop] video{object-fit:cover;object-position:center}#ml[data-fit=stretch] img,#ml[data-fit=stretch] video{object-fit:fill}
#al{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;background:#c0392b;color:#fff;font:700 4.4vh 'Segoe UI',Arial,sans-serif;padding:1.6vh 3vw 2vh;text-align:center;box-shadow:0 -4px 18px #0008;line-height:1.25;max-height:55vh;overflow:hidden}
#al div{width:100%;margin:.08em 0;overflow-wrap:anywhere}
/* alert colours (control page) */
.alsw{width:34px;height:34px;min-width:0!important;padding:0!important;border-radius:8px;border:2px solid #555;cursor:pointer;font:700 15px Arial,sans-serif}.alsw.sel{border-color:#fff;box-shadow:0 0 0 2px #e0b24a}
.alcol{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}.alcol input[type=color],.thsws input[type=color]{width:44px;height:34px;padding:0;border:2px solid #555;border-radius:8px;background:none;cursor:pointer}
.alprev{margin-top:8px;border-radius:8px;padding:8px 10px;text-align:center;font:700 15px 'Segoe UI',Arial,sans-serif;line-height:1.3;white-space:pre-line;overflow-wrap:anywhere}
/* themes for stanzas */
.thb{padding:2px 10px;font-size:12px;font-weight:600}.thb.on{border-color:#4da3ff;color:#9cc4ff}.thdot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid #fff8;vertical-align:-1px}
#thDlg{width:min(780px,95vw)}
.thprev{position:relative;aspect-ratio:16/9;width:min(440px,100%);border:2px solid #333b48;border-radius:8px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;margin:6px 0 10px}
.thprev video,.thprev .thimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thprev .thdim{position:absolute;inset:0;background:#000}
.thprev b{position:relative;font:700 21px Georgia,serif;text-align:center;padding:0 14px;line-height:1.3}
.thsws{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.thsw{width:34px;height:34px;min-width:0!important;padding:0!important;border-radius:8px;border:2px solid #555;cursor:pointer}.thsw.sel{border-color:#e0b24a;box-shadow:0 0 0 2px #e0b24a}
.thsw.def{width:auto;padding:0 10px!important;font-size:12px;background:#2a2f38;color:#ddd}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;margin:4px 0 8px;max-height:30vh;overflow:auto}
.thm{position:relative;aspect-ratio:16/9;background:#000;border:2px solid #2c313a;border-radius:6px;overflow:hidden;cursor:pointer}.thm.sel{border-color:#e0b24a;box-shadow:0 0 0 2px #e0b24a}
.thm img,.thm video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thm .thn{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#fff;font-size:11px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thm .thv{position:absolute;right:4px;top:3px;background:#000b;color:#fff;font-size:11px;padding:0 5px;border-radius:4px}
.thsec{margin:10px 0 2px;font-size:14px;font-weight:700;color:#e0b24a}
.t.timer,.t.clock{white-space:nowrap}.tbig{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.05}.tbig.done{color:#ff5a4f}
.tmsg{font-size:.28em;opacity:.9;margin:.2em 0;white-space:normal}
.t.tslide .stitle{font-weight:700;margin-bottom:.35em}.t.tslide .stext{font-size:.72em;line-height:1.3}
.tabs button{padding:9px 4px;font-size:14px}
.mprev{background:#000;border:2px solid #2c313a;border-radius:10px;overflow:hidden;margin-bottom:12px;max-width:760px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mprev.live{border-color:#e0b24a}.mprev img,.mprev video{width:100%;height:100%;object-fit:contain}
.mprev[data-fit=crop] img,.mprev[data-fit=crop] video,.thumb[data-fit=crop] img{object-fit:cover;object-position:center}.mprev[data-fit=stretch] img,.mprev[data-fit=stretch] video,.thumb[data-fit=stretch] img{object-fit:fill}
.thumb .tfit{position:absolute;left:4px;bottom:4px;min-width:0;padding:2px 8px;font-size:11px;font-weight:700;background:#000c;color:#fff;border:1px solid #666;border-radius:4px;cursor:pointer}.thumb .tfit:hover{border-color:#e0b24a;color:#e0b24a}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

.brand{align-items:center}.blogo{height:30px;background:#fff;border-radius:6px;padding:3px 7px}.brand .bt{font-weight:700;letter-spacing:.08em;color:#ece8e1}.brand .ch{color:#e0b24a;font-weight:600}
/* the top line (Prepfix logo + church name) stays fixed while the page scrolls, and the church name glows */
:root{--bh:52px}
.brand{position:sticky;top:0;z-index:30;box-sizing:border-box;height:var(--bh);margin:-14px -14px 10px;padding:0 14px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;background:#16181d;border-bottom:1px solid #2c313a;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.brand .ch{font-size:17px;font-weight:800;letter-spacing:.04em;animation:chGlow 2.4s ease-in-out infinite}
/* bigger title line: the bar now runs across the whole window; the text grows with the screen width, the bar keeps its height */
#brandbar{position:sticky;top:0;z-index:40}
.brand{position:static!important;margin:0!important;padding:0 16px!important;gap:12px;justify-content:flex-start}
.brand .blogo{height:38px;padding:3px 8px;flex:none}
.brand .bt{font-size:clamp(15px,1.75vw,25px);letter-spacing:.06em;flex:none}
.brand .ch{font-size:clamp(17px,2vw,29px)}
.brand>span:not(.bt):not(.ch){font-size:clamp(15px,1.75vw,25px);color:#e0b24a}
.brand .fsb{margin-left:auto;flex:none;padding:8px 14px;font-size:14px;font-weight:700;background:#2a2f38;border:1px solid #3a4250;white-space:nowrap}
.brand .fsb.on{background:#e0b24a;color:#1a1405;border-color:#e0b24a}
.tb{gap:6px}.tb button{padding:7px 10px;font-size:13px;white-space:nowrap}
@media(min-width:761px){.tb{display:grid;grid-template-columns:repeat(3,1fr)}.tb a.pc{display:block}.tb button,.tb a.pc button{width:100%}}
@keyframes chGlow{0%,100%{color:#e0b24a;text-shadow:0 0 3px rgba(224,178,74,.35)}50%{color:#ffe6a8;text-shadow:0 0 8px rgba(255,205,95,.95),0 0 18px rgba(240,138,18,.85)}}
@media(prefers-reduced-motion:reduce){.brand .ch{animation:none;text-shadow:0 0 8px rgba(255,205,95,.8)}}
@media(max-width:1000px){.brand .fsb .fl{display:none}.brand .fsb{padding:8px 11px;font-size:16px}}
/* welcome screen */
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#fff;cursor:pointer;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
.sp-card{text-align:center;padding:4vh 4vw;max-width:92vw}
.sp-card img{width:min(640px,86vw);height:auto;display:block;margin:0 auto}
.sp-title{margin-top:3.2vh;font:800 clamp(22px,4.4vw,46px) 'Segoe UI',Arial,sans-serif;letter-spacing:.14em;color:#0b1f4d}
.sp-church{margin-top:1.4vh;font:600 clamp(15px,2.2vw,22px) 'Segoe UI',Arial,sans-serif;color:#0a72e8;min-height:1.4em}
.sp-by{margin-top:5vh;font:600 clamp(12px,1.6vw,16px) 'Segoe UI',Arial,sans-serif;letter-spacing:.12em;color:#3b4a66}
.sp-by b{color:#f08a12}
/* the 'developed by' bar at the bottom of the program glows */
#credit{animation:crGlow 2.4s ease-in-out infinite}
@keyframes crGlow{0%,100%{color:#e0b24a;text-shadow:0 0 3px rgba(224,178,74,.35)}50%{color:#ffe6a8;text-shadow:0 0 8px rgba(255,205,95,.95),0 0 18px rgba(240,138,18,.85)}}
@media(prefers-reduced-motion:reduce){#credit{animation:none;text-shadow:0 0 8px rgba(255,205,95,.8)}}
/* round church seal (the church name in a circle) as a watermark on the church screen */
#seal{position:fixed;z-index:4;display:none;pointer-events:none;color:#fff;opacity:var(--o,.5);filter:drop-shadow(0 1px 4px rgba(0,0,0,.85))}
#seal svg{width:100%;height:100%;display:block}
#seal.tr,#seal.tl,#seal.br,#seal.bl{width:11vh;height:11vh}
#seal.tr{top:1.5vh;right:1.2vw}#seal.tl{top:2vh;left:1.6vw}
#seal.br{bottom:11vh;right:1.6vw}#seal.bl{bottom:11vh;left:1.6vw}
#seal.c{top:50%;left:50%;width:80vh;height:80vh;transform:translate(-50%,-50%);z-index:1;opacity:calc(var(--o,.5)*.5)}
/* permanent song number */
.sno{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:2.5em;height:2.5em;margin-right:9px;padding:0 .4em;border-radius:999px;background:#3a3320;border:2px solid #e0b24a;color:#ffd86b;font-weight:800;font-size:1.05em;line-height:1;font-variant-numeric:tabular-nums;flex:0 0 auto;vertical-align:middle}
.sno.after{margin:0 0 0 8px;min-width:0;height:auto;padding:.25em .7em;font-size:.85em}
h2 .sno{font-size:.72em;margin-right:12px;border-width:3px}
.selr .sno{font-size:.95em}
/* opening screen: the logo and the 'developed by' line glow */
.sp-logo{position:relative;display:inline-block}
.sp-logo::before{content:"";position:absolute;inset:-28% -12%;border-radius:50%;background:radial-gradient(ellipse,rgba(10,114,232,.85) 0%,rgba(240,138,18,.65) 40%,rgba(255,255,255,0) 72%);filter:blur(26px);animation:spPulse 2s ease-in-out infinite}
.sp-logo img{position:relative;border-radius:6px;animation:spLogo 2s ease-in-out infinite}
.sp-by{animation:spBy 2s ease-in-out infinite}
@keyframes spPulse{0%,100%{opacity:.6;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spLogo{0%,100%{filter:drop-shadow(0 0 6px rgba(10,114,232,.55))}50%{filter:drop-shadow(0 0 22px rgba(240,138,18,.95)) drop-shadow(0 0 10px rgba(10,114,232,.7))}}
@keyframes spBy{0%,100%{color:#3b4a66;text-shadow:0 0 4px rgba(10,114,232,.5)}50%{color:#0b1f4d;text-shadow:0 0 10px rgba(10,114,232,1),0 0 24px rgba(240,138,18,1),0 0 42px rgba(240,138,18,.8)}}
@media(prefers-reduced-motion:reduce){.sp-logo::before,.sp-logo img,.sp-by{animation:none}.sp-by{text-shadow:0 0 10px rgba(10,114,232,.9),0 0 22px rgba(240,138,18,.8)}}

.stz{border:3px solid #c3ccdc;border-radius:10px;margin:0 0 12px;padding:8px;background:#1d2128;box-shadow:0 0 0 1px #0008,0 0 8px rgba(195,204,220,.25)} /* every stanza has a clearly visible border, whether or not anything is on screen */
.stz.live{border-color:#e0b24a}
.stz{transition:opacity .15s,background .15s,box-shadow .15s}
/* stanza on the church screen: bright, glowing, thick green bar, big badge */
.stz.live,.stz.chor.live{border-color:#e53935;border-left-width:10px;background:#3a1214;box-shadow:0 0 0 2px #e5393555,0 0 22px #e5393566;opacity:1}

.stz.live .ln span{color:#fff;font-weight:700;font-size:1.08em}
/* stanzas NOT on screen: dimmed (only while one is showing); full brightness on hover */
*:has(>.stz.live)>.stz:not(.live){border-color:#c3ccdc}*:has(>.stz.live)>.stz:not(.live):not(.nxt) .ln span,*:has(>.stz.live)>.stz:not(.live):not(.nxt) h3{opacity:1} /* the stanzas not on screen: only the words are softer, the border stays bright */
*:has(>.stz.live)>.stz:not(.live):hover .ln span,*:has(>.stz.live)>.stz:not(.live):hover h3{opacity:1}
/* the stanza that comes NEXT: blue dashed frame + tag, never dimmed, so it is easy to find */
.stz.nxt,*:has(>.stz.live)>.stz.nxt:not(.live){border:2px dashed #4da3ff;opacity:.95}

#phDlg h3,#teamDlg h3{font-size:26px}
#phDlg .qr img,#teamDlg .qr img{width:min(46vh,380px);height:min(46vh,380px)}
#phDlg .steps,#teamDlg .steps{font-size:18px}
#teamDlg input{font-size:16px}
@media(min-width:1000px){#phBody,#teamBody{columns:2;column-gap:48px}#phBody>*,#teamBody>*{break-inside:avoid}}

/* church and stream lines: each its own colour */
.srow.churchrow{border-left:5px solid #ffb54a;background:#2a2010;padding-left:8px;border-radius:6px}
.srow.churchrow .slab{color:#1a1204;background:#ffb54a;border-radius:6px;padding:2px 6px;text-align:center}.srow.churchrow .sval b{color:#fff}
.srow.streamrow{border-left:5px solid #4dd0e1;background:#0f2a30;padding-left:8px;border-radius:6px;margin-top:4px}
.srow.streamrow .slab{color:#021418;background:#4dd0e1;border-radius:6px;padding:2px 6px;text-align:center}.srow.streamrow .sval b{color:#fff}
.srow.churchrow .stog{background:#6b4a14;color:#ffe2b0}.srow.streamrow .stog{background:#145a66;color:#d6f8ff}

.ln span b.l2{font-weight:inherit;cursor:pointer;border-bottom:2px solid #e0b24a;border-radius:2px}.ln span b.l2:hover{background:#3a4560}

/* bigger text, round yellow song numbers, clickable lines, church-screen preview bottom right */
body{font-size:17px}
.song>span,.fold .fn,.selr span{font-size:1.06em}
.sno{background:#f5c542;border:2px solid #ffe08a;color:#1a1405;box-shadow:0 0 0 2px #0006}
.song.cur .sno,.song.cur>span:first-child .sno{background:#ffd24d;color:#1a1405}
.sno.after{background:#f5c542;color:#1a1405}
.ln,.ln span,.stz .ln span{cursor:pointer!important}
.ln span,.stz .ln span{font-size:18.5px!important;line-height:1.45!important}
.stz .ln,.ln{padding:5px 6px!important;border-radius:8px}
.ln:hover{background:#2a3550}.ln.now:hover{background:#f5c542}
.pvw{bottom:34px!important;right:14px;z-index:45}

/* LIVE badge for the stream */
.livebadge{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.1em;background:#2a2f38;color:#8a90a0;border:2px solid #3a4150}
.livebadge.on{background:#e02424!important;color:#fff;border-color:#ff8a8a;animation:livePulse 1.4s ease-in-out infinite}
.livebadge.on::before{content:"";width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff}
@keyframes livePulse{0%,100%{box-shadow:0 0 6px 1px #ff3b3bcc,0 0 14px 3px #ff3b3b66}50%{box-shadow:0 0 14px 4px #ff5a5af2,0 0 28px 8px #ff3b3b99}}

/* no yellow line under lyric lines; no star on songs */
.ln span b.l2{border-bottom:0!important;border-radius:0}
.star,.song .star,.star.big{display:none!important}

/* brighter, easier-to-read stanzas that are not on screen (no more dull text) */
.stz .ln span{color:#f2f5fa}.stz h3{color:#dfe6f2}
*:has(>.stz.live)>.stz:not(.live){background:#232a35}
.stz.live .ln span{color:#fff}.stz.live h3{color:#ff9d9a}
/* duplicate songs */
.dgrp{border:2px solid #e0b24a;border-radius:10px;margin:0 0 14px;padding:8px;background:#242a33}
.dgrp>h4{margin:0 0 6px;color:#e0b24a;font-size:14px}
.dsong{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-top:1px solid #333a45;font-size:14px}
.dsong:first-of-type{border-top:0}
.dsong input[type=checkbox]{width:auto;margin-top:4px}
.dsong .dm{flex:1;min-width:0}.dsong .dm small{color:#aab3c2}
.dsong .shr{color:#f2f5fa;font-size:13px;font-style:italic;white-space:pre-wrap;background:#1a1f27;border-left:3px solid #e0b24a;padding:4px 8px;margin-top:4px;border-radius:4px}
.dsong.del{opacity:.55;text-decoration:line-through}.dsong .dtag{display:inline-block;text-decoration:none}
#dupDlg{width:min(820px,96vw)}#dupRes{max-height:60vh;overflow:auto}

/* stanzas run from left to right across the free space, instead of one long column */
.stzgrid{display:block}
@media(min-width:900px){.stzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;align-items:start}.stzgrid>.stz{margin:0}}

/* the last stanza of the song: a solid magenta frame (no movement) and a tag, so you know the song ends here */
.stz.lst{border-color:#ff4fa3}
.lsttag{background:#ff4fa3;color:#2a0516;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 8px;border-radius:999px;margin-right:6px}

/* the stanza you jumped to with the Left / Right arrows: yellow outline; press a line number to put that line live */
.stz.jmp{outline:4px solid #ffd54a;outline-offset:2px}
.stz.jmp:not(.live) h3::after{content:"JUMPED HERE · press a line number";margin-left:auto;background:#ffd54a;color:#241a00;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}

/* song title: number badge and title run on one line from left to right; the buttons go beside it, or under it when there is no room */
@media(min-width:761px){
.bar.sh{flex-wrap:wrap}
.bar.sh>h2{flex:1 1 auto!important;min-width:0!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center}
.bar.sh>h2 .sno{flex:none}
.bar.sh>h2 .fstar{flex:none;margin-right:6px}
}

.dcnt{display:inline-block;background:#3a4455;color:#fff;font-weight:800;font-size:15px;padding:2px 10px;border-radius:999px;margin-left:4px}
.dcnt.mx{background:#2e9d6b;font-size:17px;box-shadow:0 0 0 2px #7fe0b0}
.dcnt.mn{background:#6b3a3a}
.dtag{font-size:11px;font-weight:800;letter-spacing:.05em;color:#7fe0b0;margin-left:4px}.dtag.lo{color:#ff9a8a}.dtag.eq{color:#aab3c2}
.dbar{height:6px;background:#1a1f27;border-radius:3px;margin-top:5px;overflow:hidden}.dbar i{display:block;height:100%;background:#4da3ff}
.dsong.most{background:#12301f;border-left:6px solid #2e9d6b;border-radius:6px}.dsong.most .dbar i{background:#2e9d6b}

#list .song.kb{outline:3px solid #ffd54a;outline-offset:-2px;background:#3a3320;border-radius:6px}
.bar.sh h2{overflow-wrap:anywhere;word-break:break-word;min-width:0}main,#main{min-width:0}
#winb{position:fixed;top:6px;right:8px;z-index:200;display:flex;gap:4px}
#winb button{padding:3px 11px;font-size:15px;line-height:20px;background:#262b35;color:#e9e6df;border:1px solid #3a4150;border-radius:6px;opacity:.85}
#winb button:hover{opacity:1;background:#323946}#winb button.x:hover{background:#b8392f;border-color:#b8392f}
</style></head>
<body>
<script>
const Q=new URLSearchParams(location.search),V0=Q.get('view')||'control',PREVIEW=V0==='preview',V=PREVIEW?'church':V0;
document.body.className=V+(PREVIEW?' preview':'');
// window titles: the server finds the projector window by this title to hide / show it
if(V==='church'&&!PREVIEW)document.title='Church Lyrics Projector';else if(V==='stream')document.title='Church Lyrics Stream';
let S={songs:[],playlists:[],settings:{church:{},stream:{}},live:{}},online=true;
const postJ=(u,p,quiet)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})
  .then(r=>{if(!r.ok)throw 0}).catch(()=>{if(!quiet)alert('Could not reach the Church Lyrics server. Check that it is still running on the computer.')});
const post=p=>postJ('/api/state',p);
const setLive=live=>{S.live=live;if(V==='control')renderMain();postJ('/api/live',{live},true)};
const licBad=l=>!!(l&&l.status&&!['ok','expired','suspended'].includes(l.status)); // no licence, or a copied / edited one
const licStopped=l=>!!(l&&(l.status==='expired'||l.status==='suspended'));
const fmtDay=d=>{try{return new Date(d+'T12:00:00Z').toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'})}catch(e){return d}};
async function renewLicence(inputId,msgId){
  const i=document.getElementById(inputId),m=document.getElementById(msgId),code=(i&&i.value||'').trim();if(!code){if(m)m.textContent='Type or paste the renewal code first.';return}
  if(m)m.textContent='Checking…';
  let r={};try{r=await (await fetch('/api/license/renew',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})})).json()}catch(e){r={error:'Could not reach the toolkit.'}}
  if(!r.ok){if(m)m.textContent=r.error||'That code did not work.';return}
  if(i)i.value='';if(m)m.textContent='';alert('Thank you! The licence is now paid until '+fmtDay(r.until)+'.');
}
const DEV=Math.random().toString(36).slice(2,8); // this screen's own id, used to keep the laptop and phones on the same song
// The church name as it must be written everywhere (the licence holds it without dots)
const dispChurch=n=>{const t=String(n||'').trim();return /^f\.?g\.?c\.?k\W*muranga\W*l\.?c\.?a$/i.test(t.replace(/[\u2019'`]/g,'').replace(/\s+/g,' '))?'F.G.C.K MURANG\u2019A L.C.A':t};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// A blank line starts a new stanza. Lines that only look empty (spaces, hidden characters) count as blank; several blank lines count as one.
const stanzas=t=>{
  const out=[];let cur=[];
  String(t||'').replace(/\r/g,'').split('\n').forEach(l=>{
    l=l.replace(/[\u00a0\u2000-\u200d\u2028\u2029\u202f\u3000\ufeff]/g,' ').trim();
    if(l)cur.push(l);else if(cur.length){out.push(cur);cur=[]}
  });
  if(cur.length)out.push(cur);
  // Stanzas are never cut automatically: what you type between blank lines is one stanza. To split a long stanza, put a blank line where you want the break.
  return out;
};
const FONTS=['Georgia','Arial','Verdana','Tahoma','Trebuchet MS','Segoe UI','Calibri','Cambria','Century Gothic','Franklin Gothic Medium','Palatino Linotype','Book Antiqua','Times New Roman','Impact','Courier New'];

const es=new EventSource('/events?view='+V0);
es.addEventListener('data',e=>{Object.assign(S,JSON.parse(e.data));if(V==='control'){followOpen();renderAll();autoProjector()}else renderOut()});
es.addEventListener('live',e=>{S.live=JSON.parse(e.data)||{};if(S.live.serverNow)clockOff=S.live.serverNow-Date.now();if(V==='control'){const moved=followOpen();if(moved)renderSide();renderMain();if(S.live.mode==='song'&&S.live.songId===curSong&&view==='song')setTimeout(scrollNow,60)}else renderOut()});
// The song opened (or a line pressed) on ANY laptop or phone opens on all of them, and each one shows where we are
let lastOpen=null;
function followOpen(){
  const L=S.live||{};
  if(!L.open||L.openBy===DEV||L.open===lastOpen||!(S.songs||[]).some(x=>x.id===L.open))return false;
  lastOpen=L.open;if(typeof view!=='undefined'&&view==='media')return false;
  curSong=L.open;view='song';return true;
}
es.addEventListener('screens',e=>{S.screens=JSON.parse(e.data)||{};V==='control'&&renderMain()});
// the projector opens by itself, full screen, when the toolkit starts (on the computer that runs it, and only when a projector / second screen is connected, so it never covers the control page)
let autoProjDone=false;
function autoProjector(){
  return;
  if(autoProjDone||V!=='control'||!LOCALPC||!S.settings)return;
  if(((S.settings||{}).church||{}).autoProjector===false)return;
  autoProjDone=true;
  try{if(sessionStorage.getItem('autoProj'))return;sessionStorage.setItem('autoProj','1')}catch(e){}
  setTimeout(async()=>{
    if((S.proj&&S.proj.on)||screenOpen())return;
    try{const r=await (await fetch('/api/screens')).json(),ext=(r.screens||[]).filter(x=>!x.primary);if(!ext.length)return;
      if((S.proj&&S.proj.on)||screenOpen())return;postJ('/api/projector',{action:'open',screen:ext[0].i},true)}catch(e){}
  },4000);
}
es.addEventListener('proj',e=>{S.proj=JSON.parse(e.data)||{};V==='control'&&renderMain()});
/* closes together with the program: the black window closes -> this tab closes; this tab closes -> the program closes */
const LOCALPC=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
let byeDone=false,lostT=0;
function programClosed(){
  if(byeDone)return;byeDone=true;
  try{window.close()}catch(e){}
  setTimeout(()=>{ // still here = the browser refused to close the tab by itself: say so clearly
    const d=document.createElement('div');d.id='byeBox';
    d.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0f1115;color:#ece8e1;font:600 20px Verdana,sans-serif;text-align:center;padding:20px';
    d.innerHTML='<div style="font-size:44px;color:#2e9d6b">✔</div><div>The Prepfix Church Media Toolkit has been closed.</div><div style="font-size:15px;font-weight:400;color:#8a90a0">You can close this tab now.</div><button style="padding:12px 26px;font-size:16px;font-weight:700;cursor:pointer" onclick="window.close()">Close this tab</button>';
    document.body.appendChild(d);
  },500);
}
es.addEventListener('reload',()=>location.reload());
es.addEventListener('bye',()=>{if(V==='control')programClosed()});
es.onopen=()=>{clearTimeout(lostT);lostT=0;if(!online){online=true;V==='control'&&renderMain()}};
es.onerror=()=>{
  if(online){online=false;V==='control'&&renderMain()}
  // the program disappeared without saying goodbye (e.g. it was stopped): after 8 seconds of silence, check once and close this tab
  if(V==='control'&&LOCALPC&&!lostT&&!byeDone)lostT=setTimeout(async()=>{lostT=0;if(online||byeDone)return;try{await fetch('/logo.jpg?ping='+Date.now(),{cache:'no-store'})}catch(e){programClosed()}},8000);
};
// closing (not reloading) this tab on the program's own computer closes the program; the program waits a few seconds so a reload does not matter
if(V==='control'&&LOCALPC)addEventListener('pagehide',e=>{if(!e.persisted&&!byeDone){try{navigator.sendBeacon('/api/closing')}catch(x){}}});

/* ---------- Output screens (church / stream) ---------- */
// the computer's desktop wallpaper details, fetched each time lyrics are hidden (so a changed wallpaper is picked up)
let desk=null,deskFor=0;
function loadDesktop(stamp){
  if(deskFor===stamp)return;deskFor=stamp;
  fetch('/api/desktop').then(r=>r.json()).then(d=>{desk=d;if(d.ok){const i=new Image();i.onload=renderOut;i.src='/desktop-wallpaper?'+d.v}else renderOut()}).catch(()=>{});
}
if(V==='church')loadDesktop(-1);
// SMOOTH CHANGES: the old words fade out, the new ones fade in (church screen and stream). Pictures, videos,
// the timer and the clock change at once.
function noLyr(t){t.__want=null;t.__busy=false;t.style.transition='';t.style.opacity='1'}
function swapLyrics(t,html,fitFn){
  if(t.__want===html){if(!t.__busy)fitFn();return}
  t.__want=html;
  const done=()=>{if(t.__want!==html)return;t.innerHTML=html;fitFn();t.__busy=false;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{if(t.__want!==html)return;t.style.transition='opacity .28s ease-out';t.style.opacity='1'}))};
  if(PREVIEW){noLyr(t);t.__want=html;t.innerHTML=html;fitFn();return}
  t.__busy=true;
  if(t.textContent.trim()){t.style.transition='opacity .2s ease-in';t.style.opacity='0';setTimeout(done,200)}
  else{t.style.transition='';t.style.opacity='0';done()}
}
function renderOut(){
  let box=document.querySelector('.out');
  if(!box){box=document.createElement('div');box.className='out';box.innerHTML='<div class="t"></div>';document.body.appendChild(box)}
  const t=box.querySelector('.t'),L=S.live||{},c=S.settings.church||{},s=S.settings.stream||{};
  renderAlert();t.classList.remove('timer','clock','tslide');t.style.textTransform='';
  if(V==='church'){
    renderBrandMark();renderSeal();renderCornerClock();syncAudioEl(audioEl('au'),L.audio,PREVIEW);
    const DM=!!(L.churchHide||(L.churchBlank&&!c.wp)); // lyrics hidden (or wallpaper asked for and none chosen): show the PC's own wallpaper
    if(DM)['bm','seal','ck'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none'}); // hidden screen: only the wallpaper (and an alert, if one is showing)
    let stop=document.getElementById('lstop');
    if(licStopped(S.lic)){ // licence ended or suspended: the projector shows only this notice
      if(!stop){stop=document.createElement('div');stop.id='lstop';document.body.appendChild(stop)}
      stop.innerHTML='<img src="/logo.jpg" alt=""><div>'+(S.lic.status==='suspended'?'This toolkit has been paused by Prepfix.':'The Prepfix licence for this church has ended.')+'</div><small>Please contact Prepfix: 0720872582</small>';stop.style.display='flex';
    }else if(stop)stop.style.display='none';
    let wm=document.getElementById('wm');const bad=licBad(S.lic);
    if(bad&&!wm){wm=document.createElement('div');wm.id='wm';wm.textContent='PIRATED COPY · PREPFIX CHURCH MEDIA TOOLKIT';document.body.appendChild(wm)}
    if(wm)wm.style.display=bad?'flex':'none';
    const show=c.wp&&(L.churchBlank||c.wpBehind),isVid=/^video\//.test(c.wpType||'');
    let v=document.getElementById('bgv'),dim=document.getElementById('dim');
    if(!v){
      v=document.createElement('video');v.id='bgv';v.muted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.setAttribute('muted','');
      dim=document.createElement('div');dim.id='dim';document.body.prepend(dim);document.body.prepend(v);
    }
    if(DM){ // lyrics hidden: look exactly like the computer's own desktop wallpaper
      v.style.display='none';if(!v.paused)v.pause();dim.style.display='none';noLyr(t);t.innerHTML='';showMediaLayer(null);showYtLayer(null);
      loadDesktop(L.churchHide||2);
      const d=desk||{},mode={6:'center/contain no-repeat',2:'center/100% 100% no-repeat',0:d.tile?'top left repeat':'center no-repeat'}[d.style]||'center/cover no-repeat';
      document.body.style.background=d.ok?d.color+' url(/desktop-wallpaper?'+d.v+') '+mode:(d.color||'#000');
      return;
    }
    const TH=themeNow(L); // the theme (colour, picture or video) chosen for the stanza that is on screen
    if(TH&&TH.k==='video'){
      const ts='/media/'+TH.file;if(v.getAttribute('src')!==ts){v.setAttribute('src',ts);v.load()}
      v.style.display='block';v.style.filter='';v.style.transform='';v.defaultPlaybackRate=1;v.playbackRate=1;if(v.paused)v.play().catch(()=>{});
      document.body.style.background=TH.bg||'#000';
    }else if(TH){
      v.style.display='none';if(!v.paused)v.pause();
      document.body.style.background=TH.k==='image'?(TH.bg||'#000')+' url("/media/'+TH.file+'") center/cover no-repeat':(TH.bg||'#000');
    }else if(show&&isVid){
      const src='/wallpaper?'+c.wp;
      if(v.getAttribute('src')!==src){v.setAttribute('src',src);v.load()}
      v.style.display='block';calmVideo(v,c);
      document.body.style.background='#000';
    }else{
      v.style.display='none';if(!v.paused)v.pause();
      document.body.style.background=show?'#000 url(/wallpaper?'+c.wp+') center/cover no-repeat':(c.bg||'#000');
    }
    // optional darkening of the wallpaper while lyrics are on it
    if(TH){dim.style.opacity=TH.dim>0?String(TH.dim):'';dim.style.display=TH.dim>0?'block':'none'}
    else{dim.style.opacity='';dim.style.display=show&&c.wpBehind&&c.dim&&!L.churchBlank&&(L.church||[]).length?'block':'none'}
    t.style.color=(TH&&TH.fg)||c.color||'#fff';t.style.fontFamily=c.font||'Georgia';
    t.style.textShadow=(c.shadow||(TH&&TH.k!=='color'&&!TH.fg))?'0 .05em .25em #000,0 0 .1em #000':'none';
    // pictures, videos and picture slides cover the screen; text slides, timer and clock use the lyrics area
    const Y=L.mode==='yt'&&L.yt&&!L.churchBlank&&!licStopped(S.lic)?L.yt:null;showYtLayer(Y);if(Y){noLyr(t);t.innerHTML='';showMediaLayer(null);return}
    const M=L.mode==='media'&&L.media&&!L.churchBlank?L.media:null,textSlide=M&&M.type==='slides'&&!(M.s||{}).img;
    showMediaLayer(M&&!textSlide?M:null);
    if(M&&!textSlide){noLyr(t);t.innerHTML='';return}
    if(textSlide){noLyr(t);t.classList.add('tslide');t.innerHTML='<div class="stitle">'+esc(M.s.title||'')+'</div>'+(M.s.text?'<div class="stext">'+esc(M.s.text).replace(/\n/g,'<br>')+'</div>':'');fit(t,c.size||110);return}
    if(L.mode==='timer'&&!L.churchBlank){const ms=timerLeft(L.timer);noLyr(t);t.classList.add('timer');t.innerHTML=((L.timer||{}).msg?'<div class="tmsg">'+esc(L.timer.msg)+'</div>':'')+'<div class="tbig'+(ms<=0?' done':'')+'" id="tbig">'+fmtTime(ms)+'</div>';fit(t,320);return}
    if(L.mode==='clock'&&!L.churchBlank){noLyr(t);t.classList.add('clock');t.innerHTML='<div class="tbig" id="cbig"></div><div class="tmsg" id="cdate"></div>';tickClock(true);return}
    t.style.textTransform=c.caps?'uppercase':''; // ALL CAPS (Display settings)
    swapLyrics(t,L.churchBlank?'':(L.church||[]).map(x=>'<div>'+esc(x)+'</div>').join(''),()=>fit(t,c.size||110));
  }else{
    t.style.color=s.color||'#fff';t.style.fontFamily=s.font||'Arial';t.style.textTransform=s.caps?'uppercase':'';
    const st=s.style||'outline',o='.045em',k='#000';
    t.style.textShadow=st==='outline'?'-'+o+' -'+o+' 0 '+k+','+o+' -'+o+' 0 '+k+',-'+o+' '+o+' 0 '+k+','+o+' '+o+' 0 '+k+',0 0 .2em '+k:st==='shadow'?'0 .04em .2em #000,0 0 .08em #000':'none';
    renderSeal();renderLower3();
    {
      const lyr=!(L.streamBlank||!L.stream||(L.mode&&L.mode!=='song')||licStopped(S.lic));
      const ss=document.getElementById('sseal');if(ss)ss.style.display='none';
      swapLyrics(t,lyr?'<span class="sl">'+esc(L.stream).replace(/\n/g,'<br>')+'</span>':'',()=>fitStream(t,s.size||64,st==='box'));
    }
  }
}
// Stream lines: biggest size at which the line fits on at most two lines
function fitStream(t,max,boxed){
  const sp=t.querySelector('.sl');if(!sp){t.style.fontSize=max+'px';return}
  const txt=sp.textContent;
  const box=()=>t.scrollHeight<=t.clientHeight+1&&t.scrollWidth<=t.clientWidth+1;
  const ok=()=>sp.getClientRects().length<=2&&box();
  t.style.fontSize=max+'px';
  if(!ok()){let lo=12,hi=max;while(hi-lo>1){const m=(lo+hi)>>1;t.style.fontSize=m+'px';ok()?lo=m:hi=m}t.style.fontSize=lo+'px';
    // a long line (two parts, with commas) that still does not fit: use as many lines as it needs and keep shrinking until all of it is on the screen
    if(!box()){lo=4;hi=12;while(hi-lo>1){const m=(lo+hi)>>1;t.style.fontSize=m+'px';box()?lo=m:hi=m}t.style.fontSize=lo+'px'}}
  if(!boxed)return;
  // boxed style: every line gets its own tight box (height follows the font, never taller than the words need)
  const segs=sp.innerHTML.split(/<br\s*\/?>/i).map(h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.split(/\s+/).filter(Boolean)}); // "2 lines": keep the break
  const build=()=>{
    t.innerHTML='<div class="sw">'+segs.map(ws=>ws.map(w=>'<span>'+esc(w)+'</span>').join(' ')).join('<br>')+'</div>';
    const rows=[];let top=null;
    t.querySelectorAll('.sw span').forEach(w=>{const y=w.offsetTop;if(top===null||Math.abs(y-top)>4){rows.push([]);top=y}rows[rows.length-1].push(w.textContent)});
    t.innerHTML=rows.map(r=>'<div class="sln"><span class="sbx">'+esc(r.join(' '))+'</span></div>').join('');
    return rows.length;
  };
  let size=parseFloat(t.style.fontSize),n=build();
  for(let i=0;i<60&&size>5&&((n>2&&size>12)||t.scrollHeight>t.clientHeight+1||t.scrollWidth>t.clientWidth+1);i++){size-=2;t.style.fontSize=size+'px';n=build()}
}
// Finds the biggest font size (up to the chosen size) at which the whole text fits the screen
function fit(t,max){
  const ok=()=>t.scrollHeight<=t.clientHeight+1&&t.scrollWidth<=t.clientWidth+1;
  t.style.fontSize=max+'px';if(ok())return;
  let lo=4,hi=max; // the whole stanza must be on the screen: the font may shrink as far as needed
  while(hi-lo>1){const m=(lo+hi)>>1;t.style.fontSize=m+'px';ok()?lo=m:hi=m}
  t.style.fontSize=lo+'px';
}

function pick(sg,si,li,cv){
  jumpS=null;jumpPos=null; // anything going live clears the yellow 'jumped here' mark
  { // clicking a line of the chorus: remember which verse this chorus follows, so Next stanza carries on from that verse
    const ci0=chorusIdx(sg),L0=S.live||{};
    if(cv===undefined&&ci0>=0&&si===ci0){
      if(L0.songId===sg.id&&L0.s===ci0&&L0.cv!=null)cv=L0.cv;
      else if(L0.songId===sg.id&&L0.s!=null&&L0.s!==ci0)cv=L0.s;
      else if(chBack&&chBack.song===sg.id&&chBack.s>=0)cv=chBack.s;
    }
  }
  chBack=null;
  const st=stanzas(sg.text);if(!st[si]||st[si][li]==null)return;
  const two=PAIRS();if(two)li-=li%2;                        // 2 lines at a time: lines 1-2, 3-4 ... a last odd line shows alone
  const show=two?st[si].slice(li,li+2):st[si];
  const L=S.live||{},key=sg.id+':'+si,live={...L,mode:'song',songId:sg.id,s:si,l:li,cv,stream:two?show.join('\n'):st[si][li],streamBlank:false,open:sg.id,openBy:DEV,theme:themeFor(sg,si)};
  // the church screen changes only when a different stanza (or, with 2 lines, a different pair) is chosen
  if(L.key!==key||(L.church||[]).join('\n')!==show.join('\n')){live.key=key;live.church=show;live.churchBlank=false}
  setLive(live);
}
// Order of singing. With a chorus: stanza 1, chorus, stanza 2, chorus, stanza 3, chorus ...  Without one: the stanzas in order.
// s = stanza shown; v = the verse this step belongs to (for a chorus: the verse it follows)
function seqOf(sg){
  const n=stanzas(sg.text).length,ci=chorusIdx(sg),out=[];
  if(ci<0){for(let i=0;i<n;i++)out.push({s:i,v:i});return out}
  for(let i=0;i<n;i++){if(i===ci)continue;out.push({s:i,v:i});out.push({s:ci,v:i})}
  if(!out.length)out.push({s:ci,v:ci});
  return out;
}
function seqPos(sg,L){
  if(!sg||!L||L.songId!==sg.id||L.s==null)return -1;
  const seq=seqOf(sg),ci=chorusIdx(sg);
  if(ci>=0&&L.s===ci){
    const v=L.cv!=null?L.cv:(chBack&&chBack.song===sg.id?chBack.s:-1);
    const k=seq.findIndex(e=>e.s===ci&&e.v===v);
    return k>=0?k:seq.findIndex(e=>e.s===ci);
  }
  return seq.findIndex(e=>e.s===L.s&&e.v===L.s);
}

function step(d){
  if(view==='media')return slideStep(d);
  const sg=song();if(!sg)return;const st=stanzas(sg.text);if(!st.length)return;
  const L=S.live||{},ci=chorusIdx(sg);
  if(!(L.songId===sg.id&&st[L.s])){pick(sg,0,0);scrollNow();return}
  const si=L.s,li=L.l+d*(PAIRS()?2:1);
  if(li>=st[si].length||li<0){ // end of a stanza: carry on along the stanza / chorus order
    const seq=seqOf(sg),k=seqPos(sg,L),e=k<0?null:seq[k+(d>0?1:-1)];if(!e)return;
    pick(sg,e.s,d>0?0:st[e.s].length-1,e.s===ci?e.v:undefined);scrollNow();return;
  }
  pick(sg,si,li,si===ci?L.cv:undefined);scrollNow();
}
// with "2 lines" on, is there a pair before / after the one showing (in this song)?
function pairMore(sg,L,d){
  const st=stanzas(sg.text);if(!(L.songId===sg.id&&st[L.s]))return d>0;
  const nl=(L.l||0)+d*2;if(nl>=0&&nl<st[L.s].length)return true;
  const seq=seqOf(sg),k=seqPos(sg,L);return !!(k>=0&&seq[k+(d>0?1:-1)]);
}
function stepStanza(d){
  if(view==='media')return;
  const sg=song();if(!sg)return;const L=S.live||{},near=plNear(sg),seq=seqOf(sg),pos=seqPos(sg,L);
  if(PAIRS()){ // "2 lines": the next 2 lines of the same stanza (1 if only one is left), then the next stanza
    if(!pairMore(sg,L,d)){if(d>0&&near&&near.next){openSong(near.next.id);return}if(d<0&&near&&near.prev){openSong(near.prev.id);return}return}
    step(d);return;
  }
  if(near){
    if(d>0&&pos>=seq.length-1&&near.next){openSong(near.next.id);return}
    if(d<0&&pos<=0&&near.prev){openSong(near.prev.id);return}
  }
  if(!seq.length)return;
  const k=pos<0?0:pos+(d>0?1:-1);if(k<0||k>=seq.length)return;
  const e=seq[k];pick(sg,e.s,0,e.s===chorusIdx(sg)?e.v:undefined);scrollNow();
}

function selDo(v){

  const here=inPl()?curPl:null;

    let to=v.slice(3),pls=S.playlists;
    if(v==='mvnew'){const name=(prompt('Name for the new playlist:','')||'').trim();if(!name)return;to=uid();pls=[...pls,{id:to,name,songIds:[]}]}
    const target=pls.find(x=>x.id===to);if(!target)return;
    pls=pls.map(p=>p.id===to?{...p,songIds:[...p.songIds,...ids.filter(id=>!p.songIds.includes(id))]}:(here?p.id===here:true)?{...p,songIds:p.songIds.filter(id=>!sel.has(id))}:p);
    post({playlists:pls});sel.clear();
    alert(n+' song(s) moved to “'+target.name+'”.'+(here?'':'\nThey were taken out of any other playlist.'));return;
  }
  if(v.startsWith('sec:')){ // put the ticked songs at the end of that section
    const p=pl();if(!p)return;const rest=p.songIds.filter(id=>!sel.has(id)),mine=p.songIds.filter(id=>sel.has(id));
    let at=rest.indexOf('§'+v.slice(4));if(at<0)return;at++;while(at<rest.length&&!isSec(rest[at]))at++;
    setIds([...rest.slice(0,at),...mine,...rest.slice(at)]);return;
  }
  if(v.startsWith('fd:')){const f=v.slice(3);let name=f;if(f==='__new'){name=(prompt('Name of the new folder:')||'').trim();if(!name)return}setFolder(ids,f==='__none'?'':name);if(!inPl())sel.clear();return}
  if(v==='top'||v==='bottom'||v==='out'){
    const p=pl();if(!p)return;const rest=p.songIds.filter(id=>!sel.has(id)),mine=p.songIds.filter(id=>sel.has(id));
    setIds(v==='top'?[...mine,...rest]:v==='bottom'?[...rest,...mine]:rest);if(v==='out')sel.clear();return;
  }
  if(v.startsWith('pl:')){
    const p=S.playlists.find(x=>x.id===v.slice(3));if(!p)return;const add=ids.filter(id=>!p.songIds.includes(id));
    if(add.length)post({playlists:S.playlists.map(x=>x.id===p.id?{...x,songIds:[...x.songIds,...add]}:x)});
    alert(add.length+' song(s) added to “'+p.name+'”.'+(n>add.length?'\n'+(n-add.length)+' were already in it.':''));
  }else if(v==='newpl'){
    const name=(prompt('Name for the new playlist:','')||'').trim();if(!name)return;
    const id=uid();curPl=id;post({playlists:[...S.playlists,{id,name,songIds:ids}]});alert('Playlist “'+name+'” made with '+n+' song(s).');
  }else if(v==='fav'||v==='unfav'){
    post({songs:S.songs.map(x=>sel.has(x.id)?{...x,fav:v==='fav'}:x)});
  }else if(v==='tidy'){
    let c=0;const songs=S.songs.map(x=>{if(!sel.has(x.id)||x.bible)return x;{const f=fixKeyTitle(x.title,x.text);if(f)x={...x,title:f.title,text:f.text}}const text=tidyText(x.text),title=capWords(cleanTitle(x.title)||x.title);if(text===x.text&&title===x.title)return x;c++;return {...x,title,text}});
    if(c)post({songs});alert(c+' of '+n+' song(s) tidied.');
  }else if(v==='export'){openExport();exWhich.value='sel'}
  else if(v==='share')share(list.map((x,i)=>kc(i+1)+' '+x.title+'\n\n'+x.text).join('\n\n----------\n\n'),n+' songs');
  else if(v==='del'){
    if(!confirm('Delete '+n+' song(s) from the library?\n\n'+list.slice(0,10).map(x=>'• '+x.title).join('\n')+(n>10?'\n…and '+(n-10)+' more':'')+'\n\nThey are also taken out of every playlist.'))return;
    if(sel.has(curSong))curSong=null;
    post({songs:S.songs.filter(x=>!sel.has(x.id)),playlists:S.playlists.map(p=>({...p,songIds:p.songIds.filter(i=>!sel.has(i))}))});sel.clear();
  }
}

// Search by song number, by title, or by any words from inside the song. Capitals, punctuation and line breaks do not matter.
const lineHas=(text,kn)=>String(text||'').split(/\r?\n/).some(l=>sw(l).includes(kn));
const sw=t=>' '+String(t||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim()+' '; // ĩ ũ é … match plain i u e
// Several songs at once: write them with commas (or ; or + or one per line): numbers, titles, words from the lyrics, or a range.
//   12, 45, 100        105-110, Amazing grace        mwokozi; 33; nyakati zote
// The songs come out in the order written, each ready to open; the words that matched nothing are listed.
let multiInfo=null;
const splitTerms=k=>{
  let parts=String(k||'').split(/[,;+\n]+/).map(t=>t.trim()).filter(Boolean);
  if(parts.length===1&&/^\d+(\s+\d+)+$/.test(parts[0]))parts=parts[0].split(/\s+/); // 12 45 100
  let ranged=false;const out=[];
  parts.forEach(t=>{const m=t.match(/^(?:#|no\.?\s*)?(\d+)\s*(?:-|–|to)\s*(\d+)$/i);
    if(m&&+m[2]>=+m[1]&&+m[2]-+m[1]<300){ranged=true;for(let n=+m[1];n<=+m[2];n++)out.push(String(n))}else out.push(t)});
  return out.length>1||ranged?out:null;
};
const titleNo=x=>{const m=/^(\d{1,4})\.\s/.exec(String(x.title||''));return m?m[1]:''};
const noIs=(x,d)=>(x.no&&String(x.no)===d)||titleNo(x)===d;
function multiSearch(terms,base){
  const res=[],seen=new Set(),missing=[];
  terms.forEach(t=>{
    const m=t.match(/^(?:#|no\.?\s*|number\s*)?(\d+)$/i);let found=[];
    if(m){const d=m[1].replace(/^0+(?=\d)/,'');found=base.filter(x=>noIs(x,d))}
    else{const kn=sw(t).trim();if(kn){const ti=base.filter(x=>sw(x.title).includes(kn)).sort(byTitle);found=ti.length?ti:base.filter(x=>lineHas(x.text,kn)).sort(byTitle)}}
    if(!found.length)missing.push(t);
    found.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);res.push(x)}});
  });
  multiInfo={n:res.length,terms:terms.length,missing};
  return res;
}
function songSearch(k){
  const base=S.songs.filter(x=>(!favOnly||x.fav)&&inFolder(x));
  multiInfo=null;
  if(!k)return base.sort(sortFn);
  const terms=splitTerms(k);if(terms)return multiSearch(terms,base);
  const kn=sw(k).trim(),m=k.match(/^(?:#|no\.?\s*|number\s*)?(\d+)$/i),dg=m?m[1].replace(/^0+(?=\d)/,''):'';
  const rank=x=>{
    if(dg&&titleNo(x)===dg)return 0;
    if(dg&&x.no){const n=String(x.no);if(n===dg)return 0;if(n.startsWith(dg))return 1}
    if(!kn)return -1;
    if(sw(x.title).includes(kn))return 2;
    if(lineHas(x.text,kn))return 3;
    return -1;
  };
  return base.map(x=>({x,r:rank(x)})).filter(o=>o.r>=0)
    .sort((a,b)=>a.r-b.r||(a.r<=1?(a.x.no-b.x.no):byTitle(a.x,b.x))).map(o=>o.x);
}

  if(sg&&p&&p.songIds.includes(sg.id))plLast=p.id;
  else p=sg?S.playlists.find(x=>x.id===plLast&&x.songIds.includes(sg.id)):null;
  const i=p&&sg?p.songIds.indexOf(sg.id):-1;if(i<0)return null;
  const ids=plSongIds(p),k=ids.indexOf(sg.id);
  return {p,i:k,n:ids.length,sec:secOf(p,i),prev:S.songs.find(x=>x.id===ids[k-1]),next:S.songs.find(x=>x.id===ids[k+1])};
}

addEventListener('keydown',e=>{

  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||document.querySelector('dialog[open]'))return;
  const k=e.key;let used=true;

  else if(/^[0-9]$/.test(k)&&view==='song'&&song())numLine(k);

  else if(k==='s'||k==='S')stepStanza(1);
  else if(k==='/'||k==='f'||k==='F')goSearch();
  else if(k==='Escape')ctxClose();
  else used=false;
  if(used)e.preventDefault();
});

let numBuf='',numT=0;

/* ---- Left / Right arrows jump from stanza to stanza (nothing goes live yet); then press a line number (or Enter for line 1) to put that line of the stanza live ---- */
let jumpS=null,jumpSong=null,jumpPos=null,jumpV=null;
function jumpMark(){
  document.querySelectorAll('.stzgrid>.stz:not(.up)').forEach((el,i)=>el.classList.toggle('jmp',i===jumpS));
}
function jumpStanza(d){
  const sg=song();if(!sg)return;const st=stanzas(sg.text);if(!st.length)return;
  const L=S.live||{};
  // the jump follows the singing order: with a chorus it goes stanza 1 → chorus → stanza 2 → chorus → stanza 3 → chorus…
  const seq=seqOf(sg),lp=seqPos(sg,L);
  let base=(jumpPos!=null&&jumpSong===sg.id)?jumpPos:(lp>=0?lp:(d>0?-1:seq.length));
  jumpPos=Math.max(0,Math.min(seq.length-1,base+d));jumpS=seq[jumpPos].s;jumpV=seq[jumpPos].v;jumpSong=sg.id;
  jumpMark();
  const el=document.querySelectorAll('.stzgrid>.stz:not(.up)')[jumpS];
  if(el){const bar=document.querySelector('.status'),top0=(bar?bar.getBoundingClientRect().bottom:0)+8,r=el.getBoundingClientRect();
    if(r.top<top0||r.bottom>innerHeight-40)scrollBy({top:r.top-top0,behavior:'smooth'})}
}
function numLine(d){
  const sg=song();if(!sg)return;
  const L=S.live||{},st=stanzas(sg.text),jt=(jumpS!=null&&jumpSong===sg.id&&st[jumpS])?jumpS:null,si=jt!=null?jt:((L.songId===sg.id&&st[L.s])?L.s:0),n=(st[si]||[]).length;if(!n)return;
  clearTimeout(numT);numBuf+=d;
  const go=()=>{const v=parseInt(numBuf,10);numBuf='';if(v>=1&&v<=n){const cv=(jt!=null&&si===chorusIdx(sg))?jumpV:undefined;jumpS=null;jumpPos=null;pick(sg,si,v-1,cv);scrollNow()}};
  if(n<10||parseInt(numBuf+'0',10)>n||numBuf.length>=2)go();else numT=setTimeout(go,650);
}

// replace stanzas [from, from+cnt) of the current song with `pieces` (arrays of lines) and save at once
function spliceStanzas(from,cnt,pieces){
  const sg=song();if(!sg)return false;
  const st=stanzas(sg.text),oi=chorusIdx(sg);
  st.splice(from,cnt,...pieces);
  const text=st.map(l=>l.join('\n')).join('\n\n');
  S.songs=S.songs.map(x=>{if(x.id!==sg.id)return x;const y={...x,text};
    if(oi>=from&&oi<from+cnt){if(pieces.length)y.chorus=pieces[0].join('\n');else delete y.chorus} // the chorus stanza changed
    return y});
  post({songs:S.songs});renderMain();
  { // the stanza on the screen was edited: church and stream change at once
    const L=S.live||{},sg2=song();
    if(sg2&&L.mode==='song'&&L.songId===sg2.id&&L.s!=null&&L.s>=from){
      const ns=stanzas(sg2.text);
      if(L.s<from+cnt){const si=Math.min(L.s,ns.length-1);if(si>=0)pick(sg2,si,Math.max(0,Math.min(L.l||0,ns[si].length-1)),L.cv)}
      else{const si=L.s+pieces.length-cnt;if(ns[si])setLive({...L,s:si,key:sg2.id+':'+si})}
    }
  }
  return true;
}

// change one line: op 'edit' (val = new words), 'del', or 'paste' (val = words, put after the line). A stanza left with no lines disappears.
function lineOp(si,li,op,val){
  const sg=song();if(!sg)return false;const l=stanzas(sg.text)[si];if(!l||l[li]==null)return false;
  if(op==='edit')l[li]=val;else if(op==='del')l.splice(li,1);else if(op==='paste')l.splice(li+1,0,val);
  return spliceStanzas(si,1,l.length?[l]:[]);
}

// song numbers: change one number (swapping with the song that has it), or close the gaps left by deleted songs
function setSongNo(id,v){
  const n=parseInt(v,10);if(!(n>0)){alert('Type a number such as 12.');return false}
  const me=S.songs.find(s=>s.id===id);if(!me)return false;
  if(+me.no===n)return true;
  const other=S.songs.find(s=>s.id!==id&&+s.no===n);
  if(other){
    if(!confirm('Number '+n+' already belongs to “'+other.title+'”.\n\nSwap them? “'+other.title+'” will get '+(me.no?'number '+me.no:'no number')+'.'))return false;
    S.songs=S.songs.map(s=>s.id===id?{...s,no:n}:s.id===other.id?{...s,no:me.no}:s);
  }else S.songs=S.songs.map(s=>s.id===id?{...s,no:n}:s);
  post({songs:S.songs});renderSide();renderMain();return true;
}

/* songs */
/* ---- practice link: each song can carry a YouTube / Spotify / music link that plays in a small player
   inside the toolkit, so the praise and worship team can listen and read the lyrics together.
   It plays only on this laptop or phone – never on the church screen or the stream. ---- */
/* several practice links per song: song.links=[{u:link,n:name}], and song.link is always the first one (older songs only have link) */
function songLinks(s){return s&&Array.isArray(s.links)&&s.links.length?s.links:(s&&s.link?[{u:s.link,n:''}]:[])}
function linksText(s){return songLinks(s).map(l=>(l.n?l.n+' ':'')+l.u).join('\n')}
function parseLinks(txt){
  const out=[];
  for(const raw of String(txt||'').split(/\r?\n/)){
    const line=raw.trim();if(!line)continue;
    const m=line.match(/https?:\/\/\S+/i);let u,n='';
    if(m){u=m[0];n=line.replace(u,'').replace(/^[\s\-–—|:]+|[\s\-–—|:]+$/g,'').trim()}
    else if(!/\s/.test(line))u=line;
    else return false;
    u=fixLink(u);if(!u)return false;
    out.push({u,n:n.slice(0,40)});
  }
  return out.slice(0,12);
}
const linkFields=a=>a.length?{link:a[0].u,links:a}:{link:undefined,links:undefined};
function fixLink(v){
  v=String(v||'').trim();if(!v)return '';
  if(!/^https?:\/\//i.test(v))v='https://'+v;
  try{const u=new URL(v);return /\./.test(u.hostname)?u.href:false}catch(e){return false}
}
function ytId(u){
  const h=u.hostname.replace(/^(www|m|music)\./,'');let id='';
  if(h==='youtu.be')id=u.pathname.slice(1).split('/')[0];
  else if(/(^|\.)youtube(-nocookie)?\.com$/.test(h)){
    id=u.searchParams.get('v')||'';
    const m=u.pathname.match(/^\/(embed|shorts|live|v)\/([\w-]{6,})/);if(m)id=m[2];
  }
  return /^[\w-]{6,20}$/.test(id)?id:'';
}
function ytStart(u){
  const t=u.searchParams.get('t')||u.searchParams.get('start')||'';
  if(/^\d+$/.test(t))return +t;
  const m=t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/);return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0;
}
// works out how a link is played: embedded player, audio / video file, or the page itself
function practiceSrc(link){
  let u;try{u=new URL(link)}catch(e){return null}
  const h=u.hostname.replace(/^www\./,''),id=ytId(u),list=u.searchParams.get('list');
  if(id)return {kind:'frame',src:'https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0'+(ytStart(u)?'&start='+ytStart(u):''),name:'YouTube'};
  if(/youtube\.com$/.test(h)&&list)return {kind:'frame',src:'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list)+'&autoplay=1&playsinline=1',name:'YouTube'};
  if(h==='open.spotify.com'){const m=u.pathname.match(/\/(track|album|playlist|episode)\/(\w+)/);if(m)return {kind:'frame',src:'https://open.spotify.com/embed/'+m[1]+'/'+m[2],name:'Spotify',tall:true}}
  if(h==='audiomack.com'){const m=u.pathname.match(/^\/([^/]+)\/(song|album|playlist)\/([^/]+)/);if(m)return {kind:'frame',src:'https://audiomack.com/embed/'+m[2]+'/'+m[1]+'/'+m[3],name:'Audiomack',tall:true}}
  if(h==='soundcloud.com')return {kind:'frame',src:'https://w.soundcloud.com/player/?auto_play=true&url='+encodeURIComponent(link),name:'SoundCloud',tall:true};
  if(/\.(mp3|m4a|aac|ogg|oga|wav|opus)$/i.test(u.pathname))return {kind:'audio',src:link,name:'Music'};
  if(/\.(mp4|webm|ogv|mov)$/i.test(u.pathname))return {kind:'video',src:link,name:'Video'};
  {const m=/^(player\.)?vimeo\.com$/.test(h)&&u.pathname.match(/(\d{5,})/);if(m)return {kind:'frame',src:'https://player.vimeo.com/video/'+m[1]+'?autoplay=1',name:'Vimeo'}}
  if(/(^|\.)facebook\.com$|^fb\.watch$/.test(h))return {kind:'frame',src:'https://www.facebook.com/plugins/video.php?autoplay=1&show_text=false&href='+encodeURIComponent(link),name:'Facebook'};
  if(h==='drive.google.com'){const m=u.pathname.match(/\/file\/d\/([\w-]+)/);if(m)return {kind:'frame',src:'https://drive.google.com/file/d/'+m[1]+'/preview',name:'Google Drive'}}
  return {kind:'frame',src:link,name:h,other:true};
}
let prac=null,pracLoop=false; // prac={id,size,k,kind,name,paused,ctl}
function playPractice(id,k){
  const sg=id?S.songs.find(s=>s.id===id):song();const L=sg?songLinks(sg):[];if(!sg||!L.length)return;
  k=Math.min(Math.max(+k||0,0),L.length-1);const lk=L[k];
  const p=practiceSrc(lk.u);if(!p){alert('This practice link cannot be opened. Choose ✎ Links to fix it.');return}
  let box=document.getElementById('prac');
  if(!box){box=document.createElement('div');box.id='prac';document.body.appendChild(box)}
  const size=prac&&prac.size||'mid';prac={id:sg.id,size,k,kind:p.kind,name:p.name,paused:false,ctl:p.kind!=='frame'||['YouTube','Spotify','SoundCloud'].includes(p.name)};
  if(p.name==='YouTube')p.src+='&enablejsapi=1&origin='+encodeURIComponent(location.origin);
  const media=p.kind==='audio'?'<audio src="'+esc(p.src)+'" controls autoplay'+(pracLoop?' loop':'')+'></audio>'
    :p.kind==='video'?'<video src="'+esc(p.src)+'" controls autoplay playsinline'+(pracLoop?' loop':'')+'></video>'
    :'<iframe src="'+esc(p.src)+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
  box.className='sz-'+size+(p.kind==='audio'?' aud':'')+(p.tall?' tall':'');
  box.innerHTML='<div class="phd"><span class="pt">🎧 '+esc(String(sg.title).replace(/\*/g,''))+' <span class="hint">· '+esc(lk.n||p.name)+'</span></span>'+
    (L.length>1?'<select style="width:auto;max-width:120px;padding:3px 4px;font-size:12px" onchange="playPractice(\''+sg.id+'\',this.value)" title="Other practice links">'+L.map((l,i)=>'<option value="'+i+'"'+(i===k?' selected':'')+'>'+esc(l.n||'Link '+(i+1))+'</option>').join('')+'</select>':'')+
    '<button onclick="openSong(\''+sg.id+'\')" title="Show this song\'s lyrics">Lyrics</button>'+
    (castable(lk.u)?'<button onclick="pracToProj()" title="Show this video on the projector for the church">📺</button>':'')+(p.kind==='frame'?'<button onclick="pracSize()" title="Smaller / bigger">⇕</button>':'')+
    '<button onclick="pracOut()" title="Open in the YouTube app or a new tab">↗</button>'+
    '<button onclick="closePractice()" title="Stop and close">✕</button></div><div class="pbody">'+media+'</div>'+
    pracCtlHtml()+(p.other?'<p class="hint" style="margin:4px 8px">If this stays blank, that website does not allow playing inside other programs – press ↗ to open it.</p>':'');
  document.body.classList.add('pracOn');pracWire();dockPrac();
}
/* ---- practice player controls: pause / play, loop and previous / next song, for whichever player is open ----
   Audio and video files, YouTube, Spotify and SoundCloud can be controlled from here. Other websites (for example Audiomack)
   do not allow it, so for those pause and loop are greyed out; previous / next still change the song. */
function pracCtlHtml(){
  const c=prac&&prac.ctl;
  return '<div class="pctl"><button id="pcPrev" onclick="pracStep(-1)" title="Previous song with a practice link">⏮</button>'+
    '<button id="pcPlay" onclick="pracToggle()" title="Pause / play"'+(c?'':' disabled')+'>⏸</button>'+
    '<button id="pcLoop" class="'+(pracLoop?'on':'')+'" onclick="pracToggleLoop()" title="Repeat this song"'+(c?'':' disabled')+'>🔁</button>'+
    '<button id="pcNext" onclick="pracStep(1)" title="Next song with a practice link">⏭</button>'+
    '<span class="pnote">'+(c?'':'This website cannot be controlled from here')+'</span></div>';
}
function pracUI(){
  const a=document.getElementById('pcPlay'),l=document.getElementById('pcLoop');
  if(a&&prac)a.textContent=prac.paused?'▶':'⏸';
  if(l)l.classList.toggle('on',pracLoop);
}
function pracPost(msg){
  const f=document.querySelector('#prac iframe');
  if(f&&f.contentWindow)try{f.contentWindow.postMessage(typeof msg==='string'?msg:JSON.stringify(msg),'*')}catch(e){}
}
function pracSetPaused(v){if(prac&&prac.paused!==v){prac.paused=v;pracUI()}}
function pracToggle(){
  if(!prac||!prac.ctl)return;
  const m=document.querySelector('#prac audio,#prac video');
  if(m){if(m.paused)m.play().catch(()=>{});else m.pause();return}
  if(prac.name==='YouTube')pracPost({event:'command',func:prac.paused?'playVideo':'pauseVideo',args:[]});
  else if(prac.name==='SoundCloud')pracPost({method:prac.paused?'play':'pause'});
  else if(prac.name==='Spotify')pracPost({command:'toggle'});
  pracSetPaused(!prac.paused); // the player confirms a moment later; this keeps the button quick
}
function pracToggleLoop(){
  if(!prac||!prac.ctl)return;
  pracLoop=!pracLoop;
  const m=document.querySelector('#prac audio,#prac video');if(m)m.loop=pracLoop;
  pracUI();
}
// the song finished: repeat it if loop is on
let pracEndAt=0;
function pracEnded(){
  if(!prac||Date.now()-pracEndAt<1500)return;pracEndAt=Date.now();
  if(!pracLoop){pracSetPaused(true);return}
  if(prac.name==='YouTube'){pracPost({event:'command',func:'seekTo',args:[0,true]});pracPost({event:'command',func:'playVideo',args:[]})}
  else if(prac.name==='SoundCloud'){pracPost({method:'seekTo',value:0});pracPost({method:'play'})}
  else if(prac.name==='Spotify'){pracPost({command:'seek',timestamp:0});pracPost({command:'resume'})}
  pracSetPaused(false);
}
// previous / next: the songs of the playlist you are in, otherwise every song that has a practice link
function pracQueue(){
  const sg=prac&&S.songs.find(s=>s.id===prac.id),p=pl();
  const ids=p&&sg&&p.songIds.includes(sg.id)?plSongIds(p):S.songs.map(s=>s.id);
  return ids.map(i=>S.songs.find(s=>s.id===i)).filter(s=>s&&songLinks(s).length);
}
function pracStep(d){
  if(!prac)return;
  const q=pracQueue();
  if(q.length<2){toast('No other song with a practice link.');setTimeout(()=>toast(''),2200);return}
  let i=q.findIndex(s=>s.id===prac.id);i=i<0?0:(i+d+q.length)%q.length;
  const sg=q[i];openSong(sg.id);playPractice(sg.id,0);
}
// connect the player that was just opened so it reports play / pause / finish
function pracWire(){
  const box=document.getElementById('prac');if(!box||!prac)return;
  const m=box.querySelector('audio,video');
  if(m){m.addEventListener('play',()=>pracSetPaused(false));m.addEventListener('pause',()=>pracSetPaused(true));m.addEventListener('ended',pracEnded);return}
  const f=box.querySelector('iframe');if(!f)return;
  f.addEventListener('load',()=>{
    if(prac.name==='YouTube')pracPost({event:'listening',id:1,channel:'widget'});
    else if(prac.name==='SoundCloud')['play','pause','finish'].forEach(v=>pracPost({method:'addEventListener',value:v}));
  });
}
window.addEventListener('message',e=>{
  const f=document.querySelector('#prac iframe');
  if(!f||!prac||e.source!==f.contentWindow)return;
  let d=e.data;if(typeof d==='string'){try{d=JSON.parse(d)}catch(_){return}}
  if(!d||typeof d!=='object')return;
  if(prac.name==='YouTube'){
    const st=d.event==='onStateChange'?d.info:(d.event==='infoDelivery'&&d.info&&typeof d.info.playerState==='number'?d.info.playerState:null);
    if(st===0)pracEnded();else if(st===1)pracSetPaused(false);else if(st===2)pracSetPaused(true);
  }else if(prac.name==='SoundCloud'){
    if(d.method==='finish')pracEnded();else if(d.method==='play')pracSetPaused(false);else if(d.method==='pause')pracSetPaused(true);
  }else if(prac.name==='Spotify'&&d.type==='playback_update'){
    const q=d.payload||{};pracSetPaused(!!q.isPaused);
    if(q.isPaused&&q.duration&&q.position>=q.duration-800)pracEnded();
  }
});
function pracOut(){const sg=prac&&S.songs.find(s=>s.id===prac.id);const L=sg?songLinks(sg):[];const lk=L[prac.k||0]||L[0];if(lk)window.open(lk.u,'_blank')}
function pracSize(){

/* ---- getting lyrics from a web page: the computer opens the link, the lyrics are picked out of the page ---- */
function lyricsFromPage(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const meta=n=>((doc.querySelector('meta[property="'+n+'"],meta[name="'+n+'"]')||{}).content||'').trim();
  const h1=doc.querySelector('h1');let title=meta('og:title')||(h1?h1.textContent.trim():'')||(doc.title||'').trim();
  doc.querySelectorAll('script,style,noscript,iframe,svg,form,button,nav,header,footer,aside,select,input,textarea,template,[data-exclude-from-selection],[aria-hidden="true"],[class*="advert" i],[id*="advert" i],[class*="share" i],[class*="comment" i],[id*="comment" i],[class*="related" i],[class*="sidebar" i],[id*="sidebar" i],[class*="footer" i],[class*="navbar" i],[class*="breadcrumb" i],[class*="social" i]').forEach(e=>e.remove());
  const walk=n=>{
    if(n.nodeType===3)return n.textContent.replace(/\s+/g,' ');
    if(n.nodeType!==1)return '';
    if(n.tagName==='BR')return '\n';
    if(n.tagName==='PRE')return '\n\n'+n.textContent+'\n\n';
    const inner=[...n.childNodes].map(walk).join('');
    return /^(P|UL|OL|BLOCKQUOTE|TABLE|SECTION|ARTICLE)$/.test(n.tagName)?'\n\n'+inner+'\n\n':/^(DIV|LI|TR|H[1-6])$/.test(n.tagName)?'\n'+inner:inner;
  };
  // well-known lyrics sites first
  let parts=[...doc.querySelectorAll('[data-lyrics-container],[class*="Lyrics__Container"]')];
  if(!parts.length){const k=doc.querySelector('#lyric-body-text,.lyrics__content__ok,.lyrics__content__warning,#songLyricsDiv,.lyric-original,#song-body,.hymntext,.hymn-text,.song-lyrics,#lyrics,.lyrics');if(k&&k.textContent.trim().length>40)parts=[k]}
  if(!parts.length){ // any other page: the block with the most short lines
    const brs=e=>[...e.childNodes].filter(x=>x.nodeName==='BR').length;
    const shortP=e=>{const t=e.textContent.trim();return t&&t.length<400&&e.querySelectorAll('a').length<2?1:0};
    const score=e=>brs(e)+[...e.children].reduce((a,c)=>a+(/^(P|DIV|SPAN)$/.test(c.tagName)?brs(c)+shortP(c):0),0);
    let best=null,bs=0;
    doc.body&&doc.body.querySelectorAll('div,section,article,td,p,span,main').forEach(e=>{const s=score(e);if(s>bs){bs=s;best=e}});
    while(best){const ch=[...best.children].map(c=>[c,score(c)]).sort((a,b)=>b[1]-a[1])[0];if(ch&&ch[1]>=bs*0.4&&ch[1]>2){best=ch[0];bs=ch[1]}else break}
    if(best)parts=[best];
  }
  parts.forEach(p=>p.querySelectorAll('h1,h2,h3').forEach(h=>h.remove()));
  const JUNK=/^(lyrics|share|print|embed|you might also like|\d+\s+contributors?.*|translations?|advertisement|submit corrections?|report|writer\(s\):.*|written by.*|source:.*|read more.*|click here.*|download.*|subscribe.*|see also.*|more songs.*|related.*|tags?:.*|posted (by|on|in).*|copyright.*|©.*|watch (the )?video.*)$/i;
  // "Artist – Song Lyrics | Site" → "Song"
  title=title.split(/\s[|•·]\s/)[0].replace(/^lyrics?\s*[:\-–—]\s*/i,'').replace(/\s*[\(\[]?\s*(official\s+)?(lyrics?|letra|paroles)\b.*$/i,'').replace(/\s+by\s+.*$/i,'');

  let text=parts.map(p=>walk(p)).join('\n\n').split('\n').map(x=>x.trim())
    .filter(l=>!JUNK.test(l)&&!/https?:\/\/|www\./i.test(l)&&!/^\[[^\]]{1,60}\]$/.test(l)&&!(/lyric/i.test(l)&&norm(l.replace(/\blyrics?\b/ig,''))===norm(title))).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  const st=stanzas(text);if(st.length>3&&st.every(x=>x.length===1))text=st.map(x=>x[0]).join('\n'); // one paragraph per line on the page
  return {title:title.replace(/^["“'‘]+|["”'’]+$/g,'').trim(),text};
}

async function dropFiles(files){

  if(tab==='songs'&&curFolder&&curFolder!=='__none'){await importFrom(files,null,{folder:curFolder});return} // a song folder is open: the songs go into it

const MEDIA_RE=/\.(jpe?g|png|gif|webp|bmp|mp4|m4v|mov|webm|mkv|avi|wmv|mpe?g|3gp|mp3|wav|m4a|aac|ogg|oga|opus|flac|wma)$/i;
const natCmp=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'}).compare;
const entFile=en=>new Promise((ok,no)=>en.file(ok,no));
async function readDirFiles(dir,prefix){ // every file in a dropped folder (and its sub-folders), with its path
  const out=[],rd=dir.createReader();
  for(;;){
    const es=await new Promise((ok,no)=>rd.readEntries(ok,no));if(!es.length)break;
    for(const en of es){
      if(/^(\.|thumbs\.db$|desktop\.ini$)/i.test(en.name))continue;
      if(en.isFile)out.push({f:await entFile(en),path:prefix+en.name});
      else if(en.isDirectory)out.push(...await readDirFiles(en,prefix+en.name+'/'));
    }
  }
  return out.sort((a,b)=>natCmp(a.path,b.path));
}
// a folder dropped on the Service tab becomes ONE row with its own name; the files inside keep their names
async function dropFolderToService(name,list){
  const ok=f=>DOC_RE.test(f.name)||MEDIA_RE.test(f.name)||/^(image|video|audio)\//.test(f.type);
  const use=list.filter(x=>ok(x.f)).map(x=>x.f);
  if(!use.length){alert('The folder “'+name+'” has no pictures, videos, music, PowerPoint, PDF or Word files in it.');return null}
  const ids=await svcIdsFromFiles(use);
  return ids.length?{t:'dir',name,ids,open:true}:null;
}
async function dropMixed(ents){
  try{
    const toSvc=tab==='svc',items=[],flat=[];
    for(const en of ents){
      if(!en)continue;
      if(en.isFile){const f=await entFile(en);if(toSvc){const ids=await svcIdsFromFiles([f]);ids.forEach(id=>items.push({t:'media',id}))}else flat.push(f)}
      else if(en.isDirectory){
        const list=await readDirFiles(en,'');
        if(toSvc){const it=await dropFolderToService(en.name,list);if(it)items.push(it)}
        else list.forEach(x=>flat.push(x.f));
      }
    }
    if(toSvc)svcAddMany(items);else await dropFiles(flat);
  }catch(e){mmsg('');alert('The folder could not be read: '+(e&&e.message||e))}
}
